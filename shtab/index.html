<!doctype html><html lang="ru"><head><meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}

<title>Штаб</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: iOS-style single column, large title, inset grouped lists, fixed bottom tab bar; content board scrolls sideways */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#ECEEF5; --ink:#0D1326; --muted:#566079; --line:#DFE3EE;
  --accent:#2747D6; --accent-ink:#FFFFFF; --accent-soft:#E6EBFD;
  --burn:#C8261B; --burn-soft:#FDECEA; --warn:#8F5300; --warn-soft:#FFF1D2; --ok:#146B43; --ok-soft:#E1F3E8;
  --shadow:0 1px 2px rgba(13,19,38,.06),0 8px 24px rgba(13,19,38,.06);
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --c-video:#7B3FE4; --c-sport:#12935A; --c-money:#E08A00; --track:#E6E9F2; --hero:#2747D6; --hero-ink:#FFFFFF; --sticker:#FFD84D; --sticker-ink:#1B1600; --bot:#F4F6FB; --bot-shade:#C9D1E6; --bot-screen:#0E1A4A; --bot-eye:#5CE6FF; --bot-cheek:#FF8FB1;
  --r:20px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0D16; --surface:#141927; --surface-2:#1C2232; --ink:#EEF1F8; --muted:#9AA3BA; --line:#283044;
  --accent:#7A93FF; --accent-ink:#0A0D16; --accent-soft:#1D2752;
  --burn:#FF7366; --burn-soft:#3A1916; --warn:#F3BC55; --warn-soft:#33270E; --ok:#55D08F; --ok-soft:#10301F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --c-video:#B48CFF; --c-sport:#4BD18E; --c-money:#FFB938; --track:#262E42; --hero:#2D45C9; --hero-ink:#FFFFFF; --sticker:#FFD84D; --sticker-ink:#1B1600; --bot:#E9EDF7; --bot-shade:#9AA6C4; --bot-screen:#0A1238; --bot-eye:#6CEBFF; --bot-cheek:#FF8FB1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0D16; --surface:#141927; --surface-2:#1C2232; --ink:#EEF1F8; --muted:#9AA3BA; --line:#283044;
  --accent:#7A93FF; --accent-ink:#0A0D16; --accent-soft:#1D2752;
  --burn:#FF7366; --burn-soft:#3A1916; --warn:#F3BC55; --warn-soft:#33270E; --ok:#55D08F; --ok-soft:#10301F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --c-video:#B48CFF; --c-sport:#4BD18E; --c-money:#FFB938; --track:#262E42; --hero:#2D45C9; --hero-ink:#FFFFFF; --sticker:#FFD84D; --sticker-ink:#1B1600; --bot:#E9EDF7; --bot-shade:#9AA6C4; --bot-screen:#0A1238; --bot-eye:#6CEBFF; --bot-cheek:#FF8FB1; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{padding-block:18px 6px}
.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{margin:0 0 4px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:30px;letter-spacing:-.01em;line-height:1.1;text-wrap:balance}
h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.icon-btn{min-width:44px;min-height:44px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}
main{padding-block:8px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:24px}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-inline:4px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:4px;padding-left:6px;border-top:1px solid var(--line);min-height:60px}
.row:first-child{border-top:0}
.check{flex:none;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;border-radius:50%}
.check span{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:block;transition:background .15s,border-color .15s}
.check:hover span{border-color:var(--accent);background:var(--accent-soft)}
.burn .check span{border-color:var(--burn)}
.row-main{flex:1;min-width:0;text-align:left;border:0;background:none;padding:10px 12px 10px 2px;min-height:60px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.row-title{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.row-sub{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.chev{color:var(--muted);padding-right:14px;flex:none}
.burn-box{background:var(--burn-soft);border-radius:var(--r);overflow:hidden}
.burn-box .list{background:transparent;box-shadow:none;border-radius:0}
.burn-box .row{border-color:color-mix(in srgb,var(--burn) 18%,transparent)}
.burn-box .row-title{color:var(--burn)}
.burn-head{display:flex;align-items:center;gap:10px;padding:14px 16px 4px;color:var(--burn);font-weight:700;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--burn);flex:none}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--burn) 55%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.ex{background:var(--warn-soft);color:var(--warn);letter-spacing:.04em;text-transform:uppercase;font-size:11px}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.burn{background:var(--burn-soft);color:var(--burn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.empty{padding:22px 18px;text-align:center;color:var(--muted);font-size:15px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--burn-soft);color:var(--burn)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.banner{padding:12px 14px;border-radius:12px;font-size:14px;font-weight:500}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.burn{background:var(--burn-soft);color:var(--burn)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
/* week */
.week{padding:18px;display:flex;flex-direction:column;gap:12px}
.week-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-weight:600;font-size:40px;line-height:1;letter-spacing:-.02em}
.big small{font-size:20px;color:var(--muted)}
.segs{display:flex;gap:6px}
.segs i{flex:1;height:8px;border-radius:4px;background:var(--surface-2)}
.segs i.on{background:var(--accent)}
.hist{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.hist i{width:14px;height:14px;border-radius:4px;background:var(--surface-2)}
.hist i.ok{background:var(--ok)} .hist i.fail{background:var(--burn)}
/* quick idea */
.quick{display:flex;gap:8px;padding:8px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.quick input{flex:1;min-width:0;border:0;background:transparent;padding:0 10px;min-height:44px;font-size:16px}
.quick input:focus{outline:none}
.quick:focus-within{box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
/* board */
.board-scroll{overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-bottom:6px;scroll-padding-inline:16px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:min(82vw,272px);gap:12px;align-items:start;width:max-content}
.col{scroll-snap-align:start;background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.col-head{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;font-weight:700;font-size:14px}
.col-head span{color:var(--muted);font-weight:600}
.vcard{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:8px}
.vcard[draggable="true"]{cursor:grab}
.vcard .open{border:0;background:none;text-align:left;padding:0;display:flex;flex-direction:column;gap:4px}
.vcard .t{font-weight:600;overflow-wrap:anywhere}
.vcard .h{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.vcard .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.col-empty{font-size:13px;color:var(--muted);padding:8px 6px}
/* clients */
.ccard{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);border-left:0;border-right:0;border-bottom:0;background:none;width:100%;text-align:left;min-height:64px}
.list>li:first-child .ccard{border-top:0}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:16px;flex:none}
.ccard .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
/* numbers */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .v{font-family:var(--f-display);font-weight:600;font-size:clamp(15px,4.4vw,22px);line-height:1.1;overflow-wrap:anywhere}
.tile .l{font-size:13px;color:var(--muted);font-weight:500}
.tile.late .v{color:var(--burn)}
.tile.got .v{color:var(--ok)}
.month-sw{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month-sw b{font-family:var(--f-display);font-weight:500;font-size:18px;text-transform:capitalize}
.chart{padding:14px 12px 8px}
.chart svg{width:100%;height:auto;display:block}
.share{padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.share-row{display:flex;flex-direction:column;gap:5px}
.share-row .lab{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar i.hot{background:var(--warn)}
.insight{padding:16px 18px;font-size:17px;font-weight:600;line-height:1.35;background:var(--accent-soft);color:var(--ink);border-radius:var(--r)}
.insight small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:6px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;min-height:36px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:11px 12px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.03em;text-transform:uppercase;border-top:0}
th:first-child,td:first-child{text-align:left}
td.best{color:var(--ok);font-weight:700}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{border:0;background:none;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--accent)}
.badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--burn);color:#fff;font-size:11px;display:grid;place-items:center}
/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(8,11,20,.42)}
.panel{position:relative;background:var(--bg);width:100%;max-width:620px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:20px;max-height:88%}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sheet-top h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.2;overflow-wrap:anywhere}
.form{display:flex;flex-direction:column;gap:18px}
.group{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:4px 14px}
.field{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:0;background:transparent;padding:4px 0;min-height:32px;font-size:16px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:52px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none}
.field:focus-within label{color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:12px}
.grid2 .field,.grid3 .field{border-top:1px solid var(--line)}
.grid2 .field:nth-child(-n+2),.grid3 .field:nth-child(-n+3){border-top:0}
.inline{display:flex;gap:8px;align-items:center}
.inline input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mini{list-style:none;margin:0;padding:0}
.mini li{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);min-height:48px;padding:2px 0}
.mini li:first-child{border-top:0}
.mini .txt{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere}
.mini .txt small{display:block;color:var(--muted);font-size:13px}
.mini .done .txt{text-decoration:line-through;color:var(--muted)}
.x{border:0;background:none;min-width:40px;min-height:40px;border-radius:50%;color:var(--muted);font-size:20px}
.add-row{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.add-row input{flex:1 1 120px;min-width:0;min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px;font-size:15px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 140px}
.note{font-size:13px;color:var(--muted);padding:0 4px;line-height:1.45}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;max-width:min(92vw,480px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:700;min-height:40px;padding:0 12px;border-radius:10px}
.toast span{padding-block:8px}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:420px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3 .field:nth-child(3){border-top:1px solid var(--line)}h1{font-size:27px}}
/*v7 calendar*/
.card.calcard{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.cevs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cev{display:grid;grid-template-columns:52px 14px minmax(0,1fr);align-items:stretch;min-height:52px}
.cev-time{font:600 15px var(--f-display);color:var(--ink);padding-top:10px;line-height:1.1;display:flex;flex-direction:column;gap:2px}
.cev-time small{font:500 12px var(--f-body);color:var(--muted)}
.cev-line{position:relative}
.cev-line::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--line)}
.cev-line::after{content:"";position:absolute;left:1px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--surface)}
.cev-body{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:8px 0 10px 8px;color:var(--ink);text-decoration:none;min-width:0}
.cev-body b{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.cev.past{opacity:.45}

/* ===== v16 «Штаб 2.0»: сцена, бенто, плавающий таб-бар ===== */
:root{
  --bg:#EEEBFA; --surface:#FFFFFF; --surface-2:#F2EFFC; --ink:#15122E; --muted:#6A6690; --line:#E4DFF6;
  --accent:#3445E0; --accent-ink:#FFFFFF; --accent-soft:#E7E8FF;
  --shadow:0 1px 2px rgba(40,30,110,.05),0 10px 30px rgba(40,30,110,.08);
  --track:#E9E6F7; --bento-ink:#15122E;
  --b1:#B7A6FF; --b2:#FFC266; --b3:#A9C8FF; --b4:#F5A9EC; --b5:#C8EF7E; --b6:#8EE3CF;
  --dock:#15122E; --dock-ink:rgba(255,255,255,.6);
  --r:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0B22; --surface:#1A1638; --surface-2:#241F4A; --ink:#F2EFFF; --muted:#A39EC9; --line:#2E2860;
  --accent:#8E9BFF; --accent-ink:#0E0B22; --accent-soft:#272463; --track:#2C2760;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3);
  --b1:#A38FFF; --b2:#FFB547; --b3:#8DB4FF; --b4:#EE8FE3; --b5:#B4E25C; --b6:#6FD8C0;
  --dock:#26214F; --dock-ink:rgba(255,255,255,.62)}}
:root[data-theme="dark"]{
  --bg:#0E0B22; --surface:#1A1638; --surface-2:#241F4A; --ink:#F2EFFF; --muted:#A39EC9; --line:#2E2860;
  --accent:#8E9BFF; --accent-ink:#0E0B22; --accent-soft:#272463; --track:#2C2760;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3);
  --b1:#A38FFF; --b2:#FFB547; --b3:#8DB4FF; --b4:#EE8FE3; --b5:#B4E25C; --b6:#6FD8C0;
  --dock:#26214F; --dock-ink:rgba(255,255,255,.62)}
html,body{background:var(--bg)}
body{background:radial-gradient(120% 40% at 50% -10%,color-mix(in srgb,var(--b1) 45%,transparent),transparent 70%) no-repeat,var(--bg)}
.card,.list,.group,.wtile,.pcard,.ssec,.ncard,.note-new,.pp-add,.rte{border-radius:var(--r)}
.btn{border-radius:999px;white-space:nowrap}
.sec-head{flex-wrap:wrap;row-gap:8px}

/* header */
.top{padding-block:14px 4px}
.top .wrap{align-items:center}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.ava{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 19px var(--f-display);color:#fff;
  background:conic-gradient(from 200deg,#3445E0,#9B7BFF,#FF8FB1,#FFC266,#3445E0);box-shadow:0 0 0 3px var(--surface),0 6px 18px rgba(52,69,224,.35)}
.eyebrow{text-transform:none;letter-spacing:0;font-size:14px;font-weight:500;margin:0 0 2px}
h1{font-size:26px!important;font-weight:700}
h2{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:-.01em}
/* hero scene */
.hero.scene{background:none;padding:0;border-radius:32px;min-height:440px;display:flex;flex-direction:column;justify-content:space-between;isolation:isolate;box-shadow:0 18px 40px -12px rgba(30,20,90,.45)}
.hero.scene .scene-bg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;display:block}
.hero.scene .hud{display:none}
.hero.scene .hero-row{padding:22px 18px 0 22px;align-items:flex-start}
.hero.scene .hero-hi{font-size:16px;opacity:.95;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.hero.scene .hero-big{font-size:clamp(26px,7.6vw,34px);font-weight:700;text-shadow:0 2px 14px rgba(10,8,40,.35);max-width:12ch}
.hero.scene .bot-wrap{width:104px;height:130px;margin-top:6px;filter:drop-shadow(0 12px 14px rgba(10,8,40,.35))}
.glass{margin:0 10px 10px;padding:12px;border-radius:24px;background:rgba(14,10,46,.30);border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);display:flex;flex-direction:column;gap:10px}
.glass .hero-bar{margin:0;height:8px;background:rgba(255,255,255,.22)}

.hero .mood{background:rgba(255,255,255,.16);border-radius:18px}
.scene-bg .cloud{animation:drift 60s linear infinite alternate}
.scene-bg .cloud.c2{animation-duration:80s;animation-direction:alternate-reverse}
.scene-bg .star{animation:twinkle 3s ease-in-out infinite}
.scene-bg .shoot{stroke-dasharray:60 400;stroke-dashoffset:460;animation:shoot 9s ease-in 3s infinite}
.scene-bg .wave{stroke-dasharray:14 22;animation:flow 6s linear infinite}
.scene-bg .bird{animation:fly 26s linear infinite}
.scene-bg .glowdoor{animation:glow 3s ease-in-out infinite}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(40px)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes shoot{0%,92%{stroke-dashoffset:460;opacity:0}93%{opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes flow{to{stroke-dashoffset:-72}}
@keyframes fly{from{transform:translateX(-60px)}to{transform:translateX(460px)}}
/* day pills */
.days{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px)) 4px}
.days::-webkit-scrollbar{display:none}
.dpill{flex:none;scroll-snap-align:center;width:54px;min-height:78px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:13px;font-weight:500;position:relative;transition:transform .12s}

.dpill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:color-mix(in srgb,var(--bg) 75%,transparent)}
.dpill[aria-pressed="true"] b{color:var(--bg)} .dpill[aria-pressed="true"].has i{background:var(--b2)}
.dpill:active{transform:scale(.95)}
.dpill.past{opacity:.6}
/* bento */
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bt{position:relative;overflow:hidden;border:0;text-align:left;border-radius:28px;padding:16px;min-height:132px;color:var(--bento-ink);background:var(--bc,var(--b1));
  display:flex;flex-direction:column;justify-content:space-between;gap:10px;transition:transform .15s}
.bt:active{transform:scale(.975)}
.bt.tall{grid-row:span 2;min-height:276px}

.bt .num{font:700 34px/1 var(--f-display);letter-spacing:-.02em}
.bt .num small{font-size:16px;font-weight:600;opacity:.6}
.bt .cap{font-size:14px;font-weight:600;opacity:.8}
.bt .deco{position:absolute;right:-14px;top:-14px;font-size:84px;line-height:1;filter:drop-shadow(0 10px 12px rgba(0,0,0,.18));transform:rotate(12deg);pointer-events:none}
.bt.tall .deco{right:auto;left:50%;top:58px;transform:translateX(-50%) rotate(-8deg);font-size:92px}
.bt .dots7{display:flex;gap:5px}
.bt .dots7 i{flex:1;height:8px;border-radius:4px;background:rgba(21,18,46,.16)}
.bt .dots7 i.on{background:var(--bento-ink)}
.bt .mbar{height:8px;border-radius:4px;background:rgba(21,18,46,.16);overflow:hidden}
.bt .mbar i{display:block;height:100%;background:var(--bento-ink);border-radius:4px}
/* projects as bento */
.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px}
.pcard{background:var(--pc)!important;box-shadow:none;border-radius:28px;color:var(--bento-ink);padding:14px 14px 16px;gap:8px;min-height:190px;position:relative;overflow:hidden;justify-content:space-between}

.pc2-emo{font-size:38px;line-height:1;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18));flex:none;margin:-2px -2px 0 0}
.pcard.feat .pc2-emo{font-size:64px}

.pc2-next{font-size:13.5px;opacity:.78;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* floating dock */
.tabbar{left:50%;right:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100% - 24px));padding:6px;border:0;border-radius:999px;
  background:var(--dock);box-shadow:0 14px 34px -8px rgba(21,18,46,.55);backdrop-filter:none;-webkit-backdrop-filter:none}

.tab::before{display:none!important}
.tab svg{width:24px;height:24px;flex:none}

.eyebrow{color:var(--muted)}

<script>
(() => {
'use strict';
/* ---------- constants ---------- */
const STAGES=[['idea','Идея'],['script','Сценарий'],['shot','Снято'],['edit','Монтаж'],['pub','Опубликовано'],['done','Итоги']];
const SL=Object.fromEntries(STAGES);
const ACT={idea:'Написать сценарий',script:'Снять',shot:'Смонтировать',edit:'Опубликовать'};
const CST=[['lead','Лид'],['talks','Переговоры'],['offer','КП отправлено'],['contract','Договор'],['work','В работе'],['report','Отчёт'],['renew','Продление'],['closed','Закрыт']];
const CL=Object.fromEntries(CST);
const ACTIVE=['work','report','renew'];
const PIPE=['lead','talks','offer','contract'];
const TYPES=[['job','Работа'],['client','Клиент'],['own','Свой проект'],['life','Личное']];
const TL=Object.fromEntries(TYPES);
const FORMATS=['Reels','Карусель','Сторис','Пост'];
const PLATFORMS=['Instagram','TikTok','Telegram'];
const RUBRICS=['Разбор кейса','Ошибка маркетолога','Инструмент','Личное','Мнение'];
const SERVICES=['Таргет','SMM','Креативы','Консалтинг','Маркетинг','Тренинги'];
const DEF={weekly:4,payLate:3,noContact:14,subEnd:7,reportDay:5,incomeGoal:0,calSync:true,igSyncAt:null,mode:'personal',name:'',wStart:null,wGoal:null};
const FULL=()=>S.settings.mode==='full';
const TITLES={today:'Сегодня',projects:'Проекты',content:'Контент',sport:'Спорт',money:'Деньги',notes:'Заметки'};
const CAL='Google Calendar';

const S={videos:{},clients:{},hooks:{},reviews:{},workouts:{},body:{},moods:{},gtasks:{},gcal:{events:[],at:0,err:null,busy:false},notes:{},showAllDone:false,settings:{...DEF},tab:'today',db:null,sample:null,ready:{videos:false,clients:false,hooks:false,reviews:false,workouts:false,body:false,moods:false,gtasks:false,notes:false,settings:false},
  month:null,topBy:'saves',contentView:'board',items:{},sheet:null,downloads:null,mcp:null,offline:false,calErr:null,calBusy:new Set()};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const addMonth=s=>{const d=parse(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const weekStart=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const mKey=s=>String(s).slice(0,7);
const shiftMonth=(k,n)=>{const [y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const monthName=(k,form)=>{const [y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('ru-RU',form==='gen'?{month:'long'}:{month:'long',year:'numeric'}).replace(' г.','')};
const dayInMonth=(k,day)=>{const [y,m]=k.split('-').map(Number);const last=new Date(y,m,0).getDate();return k+'-'+pad(Math.min(Math.max(1,day||1),last))};
const MSHORT=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const fmtD=s=>{if(!s)return'';const d=parse(s);return d.getDate()+' '+MSHORT[d.getMonth()]};
const money=n=>Math.round(n||0).toLocaleString('ru-RU')+' ₸';
const num=n=>n==null||n===''?'—':Math.round(n).toLocaleString('ru-RU');
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c};
const days=n=>n+' '+plural(n,'день','дня','дней');
const toNum=v=>{if(v==null)return null;v=String(v).replace(/\s/g,'').replace(',','.');if(v==='')return null;const n=Number(v);return isFinite(n)?n:null};
const exTag=o=>o&&o.example?' <span class="tag ex">пример</span>':'';
const pname=p=>p?p.name||'Без названия':'Проект';
const ptype=p=>p&&p.type||'client';
const isActive=p=>p&&p.stage!=='closed';
const earns=p=>['job','client'].includes(ptype(p))&&isActive(p)&&!PIPE.includes(p.stage)&&p.payType!=='once'&&+p.amount>0;

/* ---------- storage ---------- */
const chains={};
function put(col,id,body){
  if(col==='settings')S.settings={...DEF,...body};else S[col][id]=body;
  render();
  if(!S.db)return Promise.resolve();
  const k=col+'/'+id;
  chains[k]=(chains[k]||Promise.resolve()).then(()=>S.db.collection(col).doc(id).set(body)).catch(e=>{
    toast(e&&e.code==='quota_exceeded'?'Хранилище заполнено. Удали старые примеры.':'Не сохранилось. Проверь интернет и повтори.');});
  return chains[k];
}
function del(col,id){
  delete S[col][id];render();
  if(!S.db)return Promise.resolve();
  const k=col+'/'+id;
  chains[k]=(chains[k]||Promise.resolve()).then(()=>S.db.collection(col).doc(id).delete()).catch(()=>toast('Не удалилось. Попробуй ещё раз.'));
  return chains[k];
}
function change(col,id,next,msg,afterUndo){
  const prev=S[col][id]?clone(S[col][id]):null;
  put(col,id,next);
  toast(msg,()=>{prev?put(col,id,prev):del(col,id);toast('Вернул как было.');if(afterUndo)afterUndo()});
}

/* ---------- toast ---------- */
let tTimer=null;
function toast(msg,undo){
  const t=$('#toast');clearTimeout(tTimer);
  t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button type="button">Отменить</button>':'');
  t.hidden=false;
  if(undo)t.querySelector('button').onclick=()=>{t.hidden=true;clearTimeout(tTimer);undo()};
  tTimer=setTimeout(()=>t.hidden=true,undo?6000:3200);
}

/* ---------- Google Calendar sync ---------- */
function findId(x,depth){
  if(depth>5||x==null)return null;
  if(typeof x==='string'){const m=x.match(/"(?:id|eventId)"\s*:\s*"([^"]+)"/);return m?m[1]:null}
  if(typeof x!=='object')return null;
  if(typeof x.eventId==='string')return x.eventId;
  if(typeof x.id==='string'&&(x.summary||x.htmlLink||x.start||x.status))return x.id;
  for(const k of ['event','data','result','structuredContent','payload']){const r=findId(x[k],depth+1);if(r)return r}
  if(typeof x.id==='string')return x.id;
  if(Array.isArray(x.content))for(const b of x.content){const r=findId(b&&b.text,depth+1);if(r)return r}
  return null;
}
function calTimes(t){
  if(t.time){const [h,m]=t.time.split(':').map(Number);const end=new Date(parse(t.date));end.setHours(h,m+60);
    return{startTime:t.date+'T'+t.time+':00',endTime:ymd(end)+'T'+pad(end.getHours())+':'+pad(end.getMinutes())+':00',allDay:false,overrideReminders:[{method:'popup',minutes:30}]}}
  return{startTime:t.date+'T00:00:00',endTime:addDays(t.date,1)+'T00:00:00',allDay:true,overrideReminders:[{method:'popup',minutes:360}]};
}
const calTitle=(t,p)=>t.title+' · '+pname(p);
function calErrText(e){
  const c=e&&e.code;
  if(c==='needs_reauth')return'Google Calendar просит переподключиться: claude.ai → Настройки → Коннекторы.';
  if(c==='server_not_connected'||c==='selection_required')return'Google Calendar не подключён: claude.ai → Настройки → Коннекторы.';
  if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required')return'Штабу не разрешён доступ к календарю. Нажми «Синхронизировать» и разреши.';
  if(c==='blocked_by_policy')return'Доступ к календарю закрыт политикой аккаунта.';
  return'Календарь не ответил. Задачи сохранены. Проверь календарь и нажми «Синхронизировать», если события нет.';
}
function patchTask(pid,tid,fn){const p=S.clients[pid];if(!p)return;const n=clone(p);const t=(n.tasks||[]).find(z=>z.id===tid);if(!t)return;fn(t);put('clients',pid,n)}
async function syncCal(force){
  if(!S.mcp||!S.settings.calSync)return;
  const jobs=[];
  for(const [pid,p] of Object.entries(S.clients)){
    if(p.example)continue;
    for(const t of p.tasks||[]){
      if(t.done||!t.date||S.calBusy.has(t.id))continue;
      if(t.calFail&&!force)continue;
      const title=calTitle(t,p);
      if(!t.calId)jobs.push({pid,t:clone(t),title,kind:'create'});
      else if(t.calDate!==t.date||(t.calTime||'')!==(t.time||'')||t.calTitle!==title)jobs.push({pid,t:clone(t),title,kind:'update'});
    }
  }
  if(!jobs.length){if(force)toast('В календаре всё актуально');return}
  let ok=0;
  for(const j of jobs){
    S.calBusy.add(j.t.id);
    try{
      const tm=calTimes(j.t);
      if(j.kind==='create'){
        const res=await S.mcp.callTool(CAL,'create_event',{summary:j.title,description:'Задача из Штаба',...tm});
        const id=findId(res,0);
        patchTask(j.pid,j.t.id,t=>{t.calId=id||'unknown';t.calDate=j.t.date;t.calTime=j.t.time||'';t.calTitle=j.title;delete t.calFail});
      }else{
        if(j.t.calId==='unknown'){patchTask(j.pid,j.t.id,t=>{t.calDate=j.t.date;t.calTime=j.t.time||'';t.calTitle=j.title});continue}
        await S.mcp.callTool(CAL,'update_event',{eventId:j.t.calId,summary:j.title,...tm});
        patchTask(j.pid,j.t.id,t=>{t.calDate=j.t.date;t.calTime=j.t.time||'';t.calTitle=j.title;delete t.calFail});
      }
      ok++;S.calErr=null;
    }catch(e){
      S.calErr=calErrText(e);
      patchTask(j.pid,j.t.id,t=>{t.calFail=true});
      if(['needs_reauth','server_not_connected','selection_required','not_in_manifest','approval_required','consent_required','blocked_by_policy','not_granted','capability_disabled'].includes(e&&e.code))break;
    }finally{S.calBusy.delete(j.t.id)}
  }
  render();
  if(ok)toast(ok===1?'Добавлено в Google Calendar':'В календаре обновлено: '+ok);
  else if(S.calErr)toast('Календарь: не получилось. Подробности в настройках.');
}
function calDeleteLater(pid,task){
  if(!task||!task.calId||task.calId==='unknown'||!S.mcp)return;
  setTimeout(async()=>{
    const p=S.clients[pid];if(p&&(p.tasks||[]).some(z=>z.id===task.id))return;
    try{await S.mcp.callTool(CAL,'delete_event',{eventId:task.calId})}catch(e){S.calErr='Событие «'+task.title+'» не удалилось из календаря. Удали вручную.';render()}
  },7000);
}

/* ---------- domain logic ---------- */
const nextStage=s=>{const i=STAGES.findIndex(x=>x[0]===s);return STAGES[Math.min(i+1,STAGES.length-1)][0]};
const hasVals=o=>o&&Object.values(o).some(x=>x!=null);
const metric=v=>hasVals(v.m7)?v.m7:(v.m48||{});
function advanceVideo(id){
  const v=clone(S.videos[id]);const ns=nextStage(v.stage);if(ns===v.stage)return;
  v.stage=ns;if(ns==='pub'&&!v.publishedAt)v.publishedAt=today();
  const msg=ns==='pub'?'Опубликовано. Через 48 часов попрошу цифры.':ns==='done'?'Итоги закрыты.':'Этап: '+SL[ns];
  change('videos',id,v,msg);
}
function lastContact(c){let d=c.createdAt||null;(c.log||[]).forEach(l=>{if(l.date&&(!d||l.date>d))d=l.date});return d}
function payState(p){if(p.status==='paid')return'paid';if(p.date&&p.date<today())return'late';return'wait'}
/* all payments for month mk, including expected monthly ones not yet recorded */
function monthPays(mk){
  const out=[];
  for(const [pid,p] of Object.entries(S.clients)){
    const real=(p.payments||[]).filter(x=>x.date&&mKey(x.date)===mk);
    real.forEach(x=>out.push({...x,pid,p}));
    if(earns(p)&&!real.length&&mk>=mKey(p.createdAt||today())){
      const vd=dayInMonth(mk,+p.payDay||10);
      if(!p.createdAt||vd>=p.createdAt)out.push({id:'v'+mk,pid,p,virtual:true,date:vd,amount:+p.amount,status:'wait'});
    }
  }
  return out;
}
function recordPay(pid,vp,msg){
  const n=clone(S.clients[pid]);n.payments=[...(n.payments||[]),{id:uid(),date:vp.date,amount:vp.amount,status:'paid',paidAt:today()}];
  change('clients',pid,n,msg||'Получено: '+money(vp.amount));
}
function weekFact(ws){const we=addDays(ws,6);return Object.values(S.videos).filter(v=>v.publishedAt&&v.publishedAt>=ws&&v.publishedAt<=we&&['pub','done'].includes(v.stage)).length}
function weekInfo(){
  const t=today(),ws=weekStart(t),plan=+S.settings.weekly||4,fact=weekFact(ws);
  const wd=(parse(t).getDay()+6)%7,left=7-wd,need=Math.max(0,plan-fact);
  const all=Object.values(S.videos).map(v=>v.createdAt).filter(Boolean).sort();
  const first=all.length?weekStart(all[0]):ws;
  const hist=[];for(let i=8;i>=1;i--){const w=addDays(ws,-7*i);if(w<first)hist.push(null);else hist.push(weekFact(w)>=plan)}
  let streak=0;for(let i=hist.length-1;i>=0;i--){if(hist[i]===true)streak++;else break}
  if(fact>=plan)streak++;
  const lastFail=hist[hist.length-1]===false;const lastFact=weekFact(addDays(ws,-7));
  let state='ok';if(need>0)state=(need>=left||wd>=3)?'warn':'calm';
  return{ws,plan,fact,need,left,hist,streak,state,lastFail,lastFact};
}
const openTasks=p=>(p.tasks||[]).filter(t=>!t.done);
const nextStep=p=>{const o=openTasks(p);if(!o.length)return null;const dated=o.filter(t=>t.date).sort((a,b)=>a.date<b.date?-1:1);return dated[0]||o[0]};

function computeItems(){
  const t=today(),tm=addDays(t,1),st=S.settings,out={burn:[],today:[],tomorrow:[],next:[]},map={};
  const kindOf=k=>/^(r7|r48|v)/.test(k)?'video':/^(wc|wq)/.test(k)?'sport':/^(p|vp)/.test(k)?'money':/^(c|s|r)/.test(k)?'client':/^rv/.test(k)?'review':'task';
  const add=(bucket,it)=>{it.kind=it.kind||kindOf(it.key);map[it.key]=it;out[bucket].push(it)};
  for(const [id,c] of Object.entries(S.clients)){
    if(c.stage==='closed')continue;
    const nm=pname(c);const open=()=>openProject(id);const type=ptype(c);
    (c.tasks||[]).forEach(tk=>{
      if(tk.done||!tk.date)return;
      const done=()=>completeTask(id,tk.id);
      const base={title:tk.title,open:()=>openTask(id,tk.id),done,ex:c.example,doneLabel:'Готово'};
      const when=tk.time?' · '+tk.time:'';
      if(tk.date<t)add('burn',{...base,key:'t'+id+tk.id,sub:nm+' · просрочено на '+days(diff(t,tk.date))});
      else if(tk.date===t)add('today',{...base,key:'t'+id+tk.id,sub:nm+(tk.time?' · в '+tk.time:' · сегодня')});
      else if(tk.date===tm)add('tomorrow',{...base,key:'t'+id+tk.id,sub:nm+when});
    });
    if(['own','life'].includes(type)&&!(c.tasks||[]).some(x=>!x.done&&x.date&&x.date<=tm)){
      const ns=nextStep(c);
      if(ns&&!ns.date)add('next',{key:'n'+id+ns.id,title:ns.title,sub:nm+' · следующий шаг',open:()=>openTask(id,ns.id),done:()=>completeTask(id,ns.id),ex:c.example,doneLabel:'Готово'});
    }
    if(PIPE.includes(c.stage))continue;
    (c.payments||[]).forEach(p=>{
      if(p.status==='paid'||!p.date)return;
      const done=()=>{const n=clone(S.clients[id]);const x=(n.payments||[]).find(z=>z.id===p.id);if(x){x.status='paid';x.paidAt=t}change('clients',id,n,'Получено: '+money(p.amount))};
      const late=diff(t,p.date);const base={key:'p'+id+p.id,open,done,ex:c.example,doneLabel:'Получил'};
      if(late>(+st.payLate))add('burn',{...base,title:'Оплата просрочена на '+days(late),sub:nm+' · '+money(p.amount)});
      else if(late>0)add('today',{...base,title:'Оплата задерживается: '+money(p.amount),sub:nm+' · '+days(late)+' после срока'});
      else if(late===0)add('today',{...base,title:(type==='job'?'Зарплата ':'Оплата ')+money(p.amount),sub:nm+' · ждём сегодня'});
      else if(p.date===tm)add('tomorrow',{...base,title:'Оплата '+money(p.amount),sub:nm});
    });
    if(earns(c)){
      const vp=monthPays(mKey(t)).find(x=>x.pid===id&&x.virtual);
      if(vp){
        const late=diff(t,vp.date);const lbl=type==='job'?'Зарплата':'Оплата';
        const base={key:'vp'+id,open,done:()=>recordPay(id,vp,lbl+' получена: '+money(vp.amount)),ex:c.example,doneLabel:'Получил'};
        if(late>(+st.payLate))add('burn',{...base,title:lbl+' не пришла: '+days(late)+' после '+fmtD(vp.date),sub:nm+' · '+money(vp.amount)});
        else if(late>=0)add('today',{...base,title:lbl+' '+money(vp.amount),sub:nm+' · '+(late?days(late)+' после срока':'день выплаты')});
        else if(vp.date===tm)add('tomorrow',{...base,title:lbl+' '+money(vp.amount),sub:nm+' · завтра'});
      }
    }
    if(type==='client'&&ACTIVE.includes(c.stage)){
      const lc=lastContact(c);
      if(lc&&diff(t,lc)>(+st.noContact))add('burn',{key:'c'+id,title:'Нет контакта '+days(diff(t,lc)),sub:nm+' · напиши или созвонись',open,ex:c.example,doneLabel:'Связался',
        done:()=>{const n=clone(S.clients[id]);n.log=[{id:uid(),date:t,text:'Контакт'},...(n.log||[])];change('clients',id,n,'Записал контакт с '+nm)}});
      if(c.payType==='monthly'&&c.subEnd){
        const d=diff(c.subEnd,t);
        if(d>=0&&d<=(+st.subEnd))add('burn',{key:'s'+id,title:'Абонемент до '+fmtD(c.subEnd)+': пора продлевать',sub:nm+' · отметь, когда продлишь',open,ex:c.example,doneLabel:'Продлил',
          done:()=>{const n=clone(S.clients[id]);n.subEnd=addMonth(n.subEnd);change('clients',id,n,'Продлено до '+fmtD(n.subEnd))}});
      }
      if(c.payType==='monthly'&&c.reportSent!==mKey(t)){
        const day=parse(t).getDate(),pm=monthName(shiftMonth(mKey(t),-1),'gen');
        const it={key:'r'+id,open,ex:c.example,doneLabel:'Отправил',
          done:()=>{const n=clone(S.clients[id]);n.reportSent=mKey(t);n.log=[{id:uid(),date:t,text:'Отправлен отчёт за '+pm},...(n.log||[])];change('clients',id,n,'Отчёт за '+pm+' отправлен')}};
        if(day>(+st.reportDay))add('burn',{...it,title:'Отчёт за '+pm+' не отправлен',sub:nm+' · срок был до '+st.reportDay+'-го'});
        else add('today',{...it,title:'Отчёт за '+pm,sub:nm+' · отправить до '+st.reportDay+'-го'});
      }
    }
  }
  for(const [id,v] of Object.entries(S.videos)){
    const nm=v.topic||'Без темы';const open=()=>openVideo(id);
    if(ACT[v.stage]&&v.planDate){
      const done=()=>advanceVideo(id);
      if(v.planDate<=t)add('today',{key:'v'+id,title:ACT[v.stage]+': '+nm,sub:'Контент · '+SL[v.stage],warn:v.planDate<t?'план был '+fmtD(v.planDate):'',open,done,ex:v.example,doneLabel:ACT[v.stage]});
      else if(v.planDate===tm)add('tomorrow',{key:'v'+id,title:ACT[v.stage]+': '+nm,sub:'Контент · '+SL[v.stage],open,done,ex:v.example});
    }
    if(['pub','done'].includes(v.stage)&&v.publishedAt){
      const ago=diff(t,v.publishedAt);
      if(ago>=7&&!hasVals(v.m7))add('today',{key:'r7'+id,title:'Внести итоги 7 дней',sub:nm,open:()=>openVideo(id,'m7'),ex:v.example,results:true});
      else if(ago>=2&&!hasVals(v.m48)&&!hasVals(v.m7))add('today',{key:'r48'+id,title:'Внести итоги 48 часов',sub:nm,open:()=>openVideo(id,'m48'),ex:v.example,results:true});
    }
  }
  {const w=S.workouts[t]||{},go=()=>{S.tab='sport';render()};
   if(!wdone(w))add('today',{key:'wc'+t,title:'Кардио: бег или велик',sub:'Спорт · выбери во вкладке «Спорт»',open:go});
   if(!w.squats)add('today',{key:'wq'+t,title:'100 приседаний',sub:'Спорт · каждый день',open:go,done:()=>setWorkout(t,{squats:true},'100 приседаний засчитано'),doneLabel:'Сделал'});}
  for(const e of S.gcal.events){if(!e.isTask)continue;const dk='gt'+e.id+'_'+e.date;if(S.gtasks[e.id+'_'+e.date])continue;
    const it2={key:dk,kind:'task',title:e.title,sub:'Google Календарь'+(e.allDay?'':' · '+e.time),open:()=>{let w=null;try{w=e.link?window.open(e.link,'_blank'):null}catch(_){}if(!w)toast('Задача из Google Календаря. Отметь кружком, когда сделаешь.')},done:()=>{put('gtasks',e.id+'_'+e.date,{done:true,title:e.title,at:today()});toast('Готово: '+e.title,()=>del('gtasks',e.id+'_'+e.date))},doneLabel:'Готово'};
    if(e.date===t)add('today',it2);else if(e.date===tm)add('tomorrow',it2)}
  {const due=reviewDue();if(due)add('today',{key:'rv'+due,title:'Разбор недели · 5 минут',sub:'Цифры уже посчитаны, впиши вывод и цель',open:()=>openReview(due)});}
  out.today.sort((a,b)=>(a.sub.includes(' · в ')?0:1)-(b.sub.includes(' · в ')?0:1));
  S.items=map;return out;
}
function completeTask(pid,tid){
  const n=clone(S.clients[pid]);const x=(n.tasks||[]).find(z=>z.id===tid);if(!x)return;x.done=true;x.doneAt=today();
  const left=(n.tasks||[]).filter(z=>!z.done).length;
  change('clients',pid,n,left?'Готово: '+x.title:'Готово. В «'+pname(n)+'» задач не осталось.');

function md(src){

  for(const ln of lines){const l=ln.trim();
    if(/^[-•*]\s+/.test(l)){if(!ul){out+='<ul>';ul=true}out+='<li>'+inl(l.replace(/^[-•*]\s+/,''))+'</li>';continue}
    if(ul){out+='</ul>';ul=false}

}

  const late=ps.filter(p=>payState(p)==='late').reduce((a,p)=>a+(+p.amount||0),0);

    '<div class="card tile got"><span class="v">'+money(got)+'</span><span class="l">Получено</span></div>'+

      '<span class="amt">'+money(x.got+x.exp)+'<small>'+(x.exp?(x.got?'получено '+money(x.got)+', ':'')+'ждём '+money(x.exp)+(vp?' к '+fmtD(vp.date):''):'получено')+'</small></span>'+
      (vp?'<button class="btn sm ghost" data-recv="'+pid+'|'+mk+'">Получил</button>':'')+'</div>'}).join('')+'</div>';
  }
  h+='</section>';
  const real=ps.filter(p=>!p.virtual&&p.status==='paid').sort((a,b)=>(b.date||'')<(a.date||'')?-1:1);
  if(real.length)h+='<section><div class="sec-head"><h2>Записи месяца · '+real.length+'</h2></div><div class="group"><ul class="mini">'+real.map(p=>'<li><span class="txt">'+money(p.amount)+' · '+esc(pname(p.p))+exTag(p.p)+'<small>'+fmtD(p.date)+(p.note?' · '+esc(p.note):'')+'</small></span><button class="x" data-paydel="'+p.pid+'|'+p.id+'" aria-label="Удалить запись">×</button></li>').join('')+'</ul></div></section>';
  // chart
  const months=[];for(let i=11;i>=0;i--)months.push(shiftMonth(mk,-i));
  const vals=months.map(m=>monthPays(m).filter(p=>p.status==='paid').reduce((a,p)=>a+(+p.amount||0),0));
  const max=Math.max(...vals,+S.settings.incomeGoal||0,1);const W=360,H=150,pt=22,bot=22,bw=W/12;
  let svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Доход по месяцам, получено"><line x1="0" x2="'+W+'" y1="'+(H-bot)+'" y2="'+(H-bot)+'" stroke="var(--line)"/>';

  vals.forEach((v,i)=>{const bh=(H-pt-bot)*v/max,x=i*bw+bw*.18,y=H-bot-bh,cur=months[i]===mk;
    svg+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*.64).toFixed(1)+'" height="'+Math.max(bh,v?2:0).toFixed(1)+'" rx="3" fill="'+(cur?'var(--accent)':'var(--accent-soft)')+'"><title>'+monthName(months[i])+': '+money(v)+'</title></rect>';

    if(cur&&v)svg+='<text x="'+Math.min(Math.max(i*bw+bw/2,30),W-30).toFixed(1)+'" y="'+Math.max(y-6,12).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">'+Math.round(v/1000).toLocaleString('ru-RU')+'k</text>';});
  svg+='</svg>';
  h+='<section><div class="sec-head"><h2>Получено по месяцам</h2></div><div class="card chart">'+svg+'</div><p class="note">Суммы по каждому источнику вносятся в его карточке: платежи или «сумма в месяц + день выплаты».</p></section>';
  return h;
}

function copyText(text,okMsg){
  try{navigator.clipboard.writeText(text).then(()=>toast(okMsg||'Скопировано'),()=>fallbackCopy(text,okMsg))}catch(e){fallbackCopy(text,okMsg)}
}
function fallbackCopy(text,okMsg){
  const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();toast(ok?(okMsg||'Скопировано'):'Не получилось скопировать. Выдели текст вручную.');
}

/* task sheet (new or edit) */
function openTask(pid,tid,back){
  const isNew=!tid;const p=pid?S.clients[pid]:null;const t=isNew?{title:'',date:'',time:''}:(p&&(p.tasks||[]).find(z=>z.id===tid));if(!isNew&&!t)return;
  const projs=Object.entries(S.clients).filter(([,c])=>isActive(c)||c===p).sort((a,b)=>pname(a[1]).localeCompare(pname(b[1]),'ru'));
  const calNote=!S.mcp?'':!S.settings.calSync?'Синхронизация с календарём выключена в настройках.':'Задача с датой попадёт в Google Calendar. Без времени: событие на весь день с напоминанием накануне в 18:00. Со временем: напоминание за 30 минут.';
  let h=sheetTop(isNew?'Новая задача':'Задача')+'<form class="form" id="tform"><div class="group">'+
    '<div class="field"><label for="t_title">Что сделать</label><input id="t_title" value="'+esc(t.title)+'" maxlength="140" placeholder="Например: найти запчасть для батареи"></div>'+
    '<div class="field"><label for="t_proj">Проект</label><select id="t_proj">'+(projs.length?'':'<option value="">Сначала создай проект</option>')+projs.map(([id,c])=>'<option value="'+id+'"'+(id===pid?' selected':'')+'>'+esc(pname(c))+(c.example?' (пример)':'')+'</option>').join('')+'<option value="__new">+ Новый проект…</option></select></div>'+
    '<div class="field" id="t_newwrap" hidden><label for="t_newproj">Название нового проекта</label><input id="t_newproj" maxlength="80"></div></div>'+
    '<div class="group grid2">'+fld('t_date','Дата',t.date,'type="date"')+fld('t_time','Время (по желанию)',t.time,'type="time"')+'</div>'+
    (calNote?'<p class="note">'+esc(calNote)+(t.calId&&t.calId!=='unknown'?' Уже в календаре.':'')+'</p>':'')+
    '<div class="actions"><button class="btn" type="submit">'+(isNew?'Добавить':'Сохранить')+'</button>'+(isNew?'':'<button class="btn plain" type="button" data-proj="'+pid+'">Открыть проект</button><button class="btn danger" type="button" id="tdel">Удалить</button>')+'</div></form>';
  openSheet(h,{focus:isNew?'#t_title':null});
  const sel=$('#t_proj');const sync=()=>{$('#t_newwrap').hidden=sel.value!=='__new'};sel.onchange=sync;
  if(!projs.length){sel.value='__new';sync()}
  $('#tform').onsubmit=e=>{e.preventDefault();
    const title=val('t_title');if(!title){$('#t_title').focus();return}
    let target=sel.value;
    if(target==='__new'){const name=val('t_newproj');if(!name){$('#t_newproj').focus();return}
      target=uid();put('clients',target,{name,type:FULL()?'own':'life',stage:'work',createdAt:today(),tasks:[],payments:[],log:[]})}
    const date=val('t_date')||null,time=date?(val('t_time')||''):'';
    if(isNew){
      const n=clone(S.clients[target]);n.tasks=[...(n.tasks||[]),{id:uid(),title,date,time,done:false}];
      change('clients',target,n,'Задача добавлена в «'+pname(n)+'»');
    }else{
      const old=clone(t);
      if(target!==pid){
        const a=clone(S.clients[pid]);a.tasks=(a.tasks||[]).filter(z=>z.id!==tid);put('clients',pid,a);
        const b=clone(S.clients[target]);b.tasks=[...(b.tasks||[]),{...old,title,date,time}];put('clients',target,b);toast('Задача перенесена в «'+pname(b)+'»');
      }else{
        const n=clone(S.clients[pid]);const x=n.tasks.find(z=>z.id===tid);Object.assign(x,{title,date,time});if(!date&&x.calId){calDeleteLater(pid,{...old});['calId','calDate','calTime','calTitle'].forEach(k=>delete x[k])}
        change('clients',pid,n,'Сохранено');
      }
    }
    closeSheet();syncCal();if(back)back();
  };
  const d=$('#tdel');if(d)d.onclick=()=>{const prev=clone(S.clients[pid]);const n=clone(prev);n.tasks=n.tasks.filter(z=>z.id!==tid);put('clients',pid,n);calDeleteLater(pid,t);closeSheet();if(back)back();toast('Задача удалена',()=>put('clients',pid,prev))};
}

  openSheet(h,{focus:isNew?'#c_name':null,refresh:isNew?null:()=>{if(S.clients[id])renderProjDyn(id)}});

  panel.querySelectorAll('[data-ptype]').forEach(b=>b.onclick=()=>{type=b.dataset.ptype;panel.querySelectorAll('[data-ptype]').forEach(x=>{const on=x===b;x.setAttribute('aria-pressed',on);x.setAttribute('aria-checked',on)});vis()});

function cpl(k){k=k||{};return k.budget&&k.leads?money(k.budget/k.leads):'—'}
function renderProjDyn(id){
  const box=$('#cdyn');if(!box)return;const c=S.clients[id];const t=today();const type=ptype(c);
  const active=document.activeElement&&box.contains(document.activeElement)?document.activeElement.id:null;
  const keep=['nt_title','nt_date','np_date','np_amount','nl_text'].reduce((o,k)=>{const e=document.getElementById(k);if(e)o[k]=e.value;return o},{});
  const tasks=(c.tasks||[]).map((x,i)=>({...x,i}));const open=tasks.filter(x=>!x.done),done=tasks.filter(x=>x.done);

  for(const p of Object.values(S.clients)){

/* weekly review */
function weekStats(ws){
  const we=addDays(ws,6),inW=d=>d&&d>=ws&&d<=we;
  const vids=Object.entries(S.videos).filter(([,v])=>!v.example&&inW(v.publishedAt)&&['pub','done'].includes(v.stage));
  let earned=0,tasksDone=0,overdue=0,leads=0;
  for(const p of Object.values(S.clients)){if(p.example)continue;
    (p.payments||[]).forEach(x=>{if(x.status==='paid'&&inW(x.date))earned+=+x.amount||0});
    (p.tasks||[]).forEach(t=>{if(t.done&&inW(t.doneAt))tasksDone++;if(!t.done&&t.date&&t.date<=we&&t.date<today())overdue++});
    if(ptype(p)==='client'&&inW(p.createdAt))leads++;}
  const best=vids.slice().sort((a,b)=>(metric(b[1]).saves||0)-(metric(a[1]).saves||0))[0];
  let wk=0;for(let i=0;i<7;i++){if(wdone(S.workouts[addDays(ws,i)]))wk++}
  return{published:vids.length,plan:+S.settings.weekly||4,earned,tasksDone,overdue,leads,wk,best:best?best[1].topic:null};
}
function reviewDue(){
  const t=today(),ws=weekStart(t),wd=(parse(t).getDay()+6)%7,prev=addDays(ws,-7);
  if(wd>=5&&!S.reviews[ws])return ws;
  const started=Object.values(S.clients).concat(Object.values(S.videos)).filter(x=>!x.example).map(x=>x.createdAt).filter(Boolean).sort()[0];
  if(wd<=1&&!S.reviews[prev]&&started&&started<=addDays(prev,6))return prev;
  return null;
}

const MC='Metricool Social Media Management';

const tzOff=()=>{const o=-new Date().getTimezoneOffset(),a=Math.abs(o);return(o>=0?'+':'-')+pad(Math.floor(a/60))+':'+pad(a%60)};
function mcErr(e){
  const c=e&&e.code;
  if(c==='no_brand')return'В Metricool не найден аккаунт Instagram.';
  if(c==='needs_reauth')return'Metricool просит переподключиться: claude.ai → Настройки → Коннекторы.';
  if(c==='server_not_connected'||c==='selection_required')return'Metricool не подключён: claude.ai → Настройки → Коннекторы.';
  if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required')return'Штабу не разрешён доступ к Metricool. Нажми ещё раз и разреши.';
  if(c==='tool_error')return'Metricool ответил ошибкой. Попробуй позже.';
  return'Metricool не ответил. Попробуй ещё раз.';
}
const payloadOf=r=>{let p=r&&(r.payload!==undefined?r.payload:r.structuredContent);if(typeof p==='string'){try{p=JSON.parse(p)}catch(_){}}return p};
async function mcBrand(){

async function mcReels(from,to){

    metrics:['IGRE01','IGRE03','IGRE06','IGRE23','IGRE11','IGRE12','IGRE21','IGRE07','IGRE24','IGRE28']}));

function applyReel(v,r){
  if(diff(today(),r.date)>=7){v.m7={...(v.m7||{}),views:r.views,reach:r.reach,saves:r.saves,shares:r.shares,skip:skipOf(r)};v.stage='done'}
  else{v.m48={...(v.m48||{}),views:r.views,saves:r.saves};if(!['pub','done'].includes(v.stage))v.stage='pub'}
  v.ig={comments:r.comments,avgWatch:r.avgWatch,viewRate:r.viewRate,syncedAt:today()};
  if(!v.publishedAt)v.publishedAt=r.date;if(!v.postUrl)v.postUrl=r.url;
  return v;
}
async function mcPosts(from,to){

  const p=payloadOf(await S.mcp.callTool(MC,'getAnalyticsDataByMetrics',{brandId,from:from+'T00:00:00'+tzOff(),to:to+'T23:59:59'+tzOff(),
    metrics:['IGPO01','IGPO03','IGPO06','IGPO28','IGPO14','IGPO15','IGPO27','IGPO08','IGPO29']}));
  return((p&&Array.isArray(p.rows))?p.rows:[]).map(a=>({date:String(a[0]||'').replace(/^(\d{4})(\d{2})(\d{2}).*$/,'$1-$2-$3'),text:String(a[1]||''),url:String(a[2]||''),code:shortcode(a[2]),
    views:toNum(a[3]),reach:toNum(a[4]),saves:toNum(a[5]),shares:toNum(a[6]),comments:toNum(a[7]),follows:toNum(a[8])})).filter(x=>x.code&&/^\d{4}-\d{2}-\d{2}$/.test(x.date));
}
const ttId=u=>{const m=String(u||'').match(/tiktok\.com\/@[^\/]+\/video\/(\d+)/);return m?m[1]:null};
async function mcTT(from,to){
  const brandId=await mcBrand();

const capKey=t=>String(t||'').replace(/\s+/g,' ').trim().slice(0,60).toLowerCase();
let mcBusy=false;
async function mcImport(btn,silent){
  if(!S.mcp){if(!silent)toast('Статистика из Instagram пока работает только в claude.ai. Цифры можно вписать вручную в карточке ролика.');return}
  if(mcBusy)return;mcBusy=true;
  if(btn){btn.disabled=true;btn.textContent='Загружаю…'}
  try{
    const from=addDays(today(),-60),to=today();
    const [reels,posts,tts]=await Promise.all([mcReels(from,to),mcPosts(from,to).catch(()=>[]),mcTT(from,to).catch(()=>[])]);
    const byCode={},byTT={},byCap={};
    Object.entries(S.videos).forEach(([id,v])=>{const c=shortcode(v.postUrl);if(c)byCode[c]=id;const t1=ttId(v.postUrl)||ttId(v.tt&&v.tt.url);if(t1)byTT[t1]=id});
    let added=0,upd=0;const save=(id,n)=>{if(JSON.stringify(S.videos[id]||null)!==JSON.stringify(n)){put('videos',id,n);return true}return false};
    const topicOf=(t,fallback)=>{const f=String(t||'').split('\n')[0].trim();return(f||fallback).slice(0,90)};
    for(const r of reels){const id=byCode[r.code];
      if(id){const n=applyReel(clone(S.videos[id]),r);n.ig.syncedAt=S.videos[id].ig&&S.videos[id].ig.syncedAt||today();if(save(id,n))upd++;byCap[capKey(r.text)]=id}
      else{const nid=uid();byCode[r.code]=nid;byCap[capKey(r.text)]=nid;save(nid,applyReel({topic:topicOf(r.text,'Reels '+fmtD(r.date)),hook:'',format:'Reels',platforms:['Instagram'],stage:'pub',createdAt:r.date,fromIG:true},r));added++}}
    for(const r of posts){const id=byCode[r.code]||uid(),isNew=!byCode[r.code];const v=isNew?{topic:topicOf(r.text,'Пост '+fmtD(r.date)),hook:'',format:'Карусель',platforms:['Instagram'],createdAt:r.date,publishedAt:r.date,postUrl:r.url,fromIG:true}:clone(S.videos[id]);
      v.stage=diff(today(),r.date)>=7?'done':(v.stage==='done'?'done':'pub');v.m7={...(v.m7||{}),views:r.views,reach:r.reach,saves:r.saves,shares:r.shares,subs:r.follows};v.ig={...(v.ig||{}),comments:r.comments,syncedAt:(v.ig&&v.ig.syncedAt)||today()};
      byCode[r.code]=id;byCap[capKey(r.text)]=id;if(save(id,v))isNew?added++:upd++}
    for(const r of tts){let id=byTT[r.id];const ck=capKey(r.text);if(!id&&ck&&byCap[ck])id=byCap[ck];
      const isNew=!id;id=id||uid();const v=isNew?{topic:topicOf(r.text,'TikTok '+fmtD(r.date)),hook:'',format:'Видео',platforms:['TikTok'],createdAt:r.date,publishedAt:r.date,postUrl:'https://www.tiktok.com/@kingasyk71/video/'+r.id,fromIG:true}:clone(S.videos[id]);
      if(!(v.platforms||[]).includes('TikTok'))v.platforms=[...(v.platforms||[]),'TikTok'];
      v.tt={url:'https://www.tiktok.com/@kingasyk71/video/'+r.id,views:r.views,shares:r.shares,comments:r.comments};v.m7={...(v.m7||{}),ttViews:r.views};
      if(isNew)v.stage=diff(today(),r.date)>=7?'done':'pub';
      byTT[r.id]=id;if(save(id,v))isNew?added++:upd++}
    put('settings','main',{...S.settings,igSyncAt:new Date().toISOString()});
    if(!silent||added)toast(added||upd?'Статистика обновлена: новых '+added+', изменилось '+upd+'.':'Статистика свежая, изменений нет.');
  }catch(e){if(!silent)toast(mcErr(e))}
  finally{mcBusy=false;if(btn&&document.contains(btn)){btn.disabled=false;btn.textContent='↻ Обновить'}}
}
function autoSync(){
  if(!S.mcp||mcBusy)return;const last=S.settings.igSyncAt?Date.parse(S.settings.igSyncAt):0;
  if(Date.now()-last>6*3600e3)mcImport(null,true);

async function mcPullOne(btn){
  const code=shortcode(val('v_post'));
  if(!code){toast('Вставь ссылку на Reels из Instagram');$('#v_post').focus();return}
  btn.disabled=true;btn.textContent='Загружаю…';
  try{
    const pub=val('v_pubAt');
    const rows=await mcReels(pub?addDays(pub,-2):addDays(today(),-90),pub?addDays(pub,2):today());
    const r=rows.find(x=>x.code===code);
    if(!r){toast('Metricool не нашёл этот Reels. Проверь ссылку и дату публикации.');return}
    const set=(id,v)=>{const e=document.getElementById(id);if(e&&v!=null)e.value=v};
    if(!pub)set('v_pubAt',r.date);
    if(diff(today(),r.date)>=7){set('b_views',r.views);set('b_reach',r.reach);set('b_saves',r.saves);set('b_shares',r.shares);set('b_skip',skipOf(r))}

function setWorkout(day,patch,msg){
  const prev=S.workouts[day]?clone(S.workouts[day]):null;

  if(!n.cardio&&!n.squats)del('workouts',day);else put('workouts',day,n);
  if(patch.cardio){dosReact('run');FX.buzz(20)}else if(patch.squats){dosReact('jump');FX.confetti(innerWidth/2,innerHeight*.35,epColors(),40)}

function sparkW(arr){
  if(arr.length<2)return'';const pts=arr.slice(-12).map(([,x])=>+x.weight);const G=+S.settings.wGoal||null;const W=320,H=70,mn=Math.min(...pts,G||Infinity)-0.5,mx=Math.max(...pts,G||-Infinity)+0.5;
  const xy=pts.map((v,i)=>[(i/(pts.length-1))*(W-12)+6,H-6-(v-mn)/(mx-mn)*(H-16)]);
  const gy=G?H-6-(G-mn)/(mx-mn)*(H-16):0;
  return'<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Динамика веса" style="width:100%;height:auto">'+(G?'<line x1="0" x2="'+W+'" y1="'+gy.toFixed(1)+'" y2="'+gy.toFixed(1)+'" stroke="var(--ok)" stroke-dasharray="4 4"/>':'')+'<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="'+xy.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')+'"/>'+
    '<circle cx="'+xy[xy.length-1][0].toFixed(1)+'" cy="'+xy[xy.length-1][1].toFixed(1)+'" r="4" fill="var(--accent)"/></svg>';
}

async function backupSave(){
  if(!S.db||!S.db.all){toast('Нет данных для копии');return}
  const data=JSON.stringify({app:'shtab',v:1,at:new Date().toISOString(),data:S.db.all()});
  try{await S.downloads.save({filename:'shtab-backup-'+today()+'.json',data,type:'application/json'});toast('Копия сохранена')}catch(e){if(e&&e.code==='declined')toast('Сохранение отменено');else copyText(data,'Скачать не вышло, копия в буфере обмена.')}
}
async function backupLoad(e){
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  let j;try{j=JSON.parse(await f.text())}catch(_){toast('Это не файл штаба.');return}
  const dump=j&&j.app==='shtab'&&j.data;if(!dump||typeof dump!=='object'){toast('Это не файл штаба.');return}
  const n=Object.values(dump).reduce((a,c)=>a+Object.keys(c||{}).length,0);if(!n){toast('В файле пусто.');return}
  if(!confirm('Загрузить '+n+' '+plural(n,'запись','записи','записей')+' из файла? Совпадающие записи заменятся.'))return;
  toast('Загружаю…');try{const k=await S.db.importAll(dump);closeSheet();toast('Готово: '+k+' '+plural(k,'запись','записи','записей'))}catch(err){toast('Не загрузилось: '+((err&&err.message)||'ошибка')+'.')}
}
async function openBlob(id){
  if(!S.assets||!S.assets.url){toast('Файл недоступен');return}
  const w=window.open('','_blank');try{const u=await S.assets.url(id);if(w)w.location=u;else location.href=u}catch(e){if(w)w.close();toast('Файл не открылся. Попробуй ещё раз.')}
}
function csv(rows){const cell=v=>{v=v==null?'':String(v);return/[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};return'﻿'+rows.map(r=>r.map(cell).join(';')).join('\r\n')}
async function exportCSV(kind){
  let rows,name;
  if(kind==='clients'){
    rows=[['Проект','Тип','Пример','Контакт','Телефон','Ниша','Услуги','Этап','Оплата','Сумма','День выплаты','Абонемент до','Дата платежа','Сумма платежа','Статус платежа']];
    Object.values(S.clients).forEach(c=>{const base=[c.name,TL[ptype(c)],c.example?'да':'',c.contactName,c.phone,c.niche,(c.services||[]).join(', '),CL[c.stage]||'',c.payType==='once'?'Разово':'Каждый месяц',c.amount,c.payDay,c.subEnd];
      const ps=c.payments||[];if(!ps.length)rows.push([...base,'','','']);ps.forEach(p=>rows.push([...base,p.date,p.amount,{paid:'получено',wait:'ожидается',late:'просрочено'}[payState(p)]]))});
    name='shtab-projects-'+today()+'.csv';
  }else if(kind==='tasks'){
    rows=[['Проект','Тип','Задача','Дата','Время','Сделано','В календаре']];
    Object.values(S.clients).forEach(c=>(c.tasks||[]).forEach(t=>rows.push([c.name,TL[ptype(c)],t.title,t.date,t.time,t.done?(t.doneAt||'да'):'',t.calId?'да':''])));
    name='shtab-tasks-'+today()+'.csv';
  }else{
    rows=[['Тема','Пример','Хук','Площадки','Формат','Рубрика','Этап','План','Опубликовано','Пост','Сценарий','48ч просмотры','48ч сохранения','48ч подписки','7д просмотры','7д охват','7д сохранения','7д репосты','7д подписки','7д директ','7д % пропусков','TikTok просмотры','TikTok подписки','Почему']];
    Object.values(S.videos).forEach(v=>{const a=v.m48||{},b=v.m7||{};rows.push([v.topic,v.example?'да':'',v.hook,(v.platforms||[]).join(', '),v.format,v.rubric,SL[v.stage],v.planDate,v.publishedAt,v.postUrl,v.scriptPath,a.views,a.saves,a.subs,b.views,b.reach,b.saves,b.shares,b.subs,b.dms,b.skip,b.ttViews,b.ttSubs,v.why])});
    name='shtab-videos-'+today()+'.csv';
  }
  const data=csv(rows);
  if(S.downloads){try{await S.downloads.save({filename:name,data});toast('Файл сохранён');return}catch(e){if(e&&e.code==='declined'){toast('Сохранение отменено');return}}}
  copyText(data,'Скачать не вышло, CSV скопирован в буфер. Вставь в таблицу.');
}

  FX.pullToRefresh(()=>S.db&&S.db.refresh?S.db.refresh().then(()=>{toast('Свежие данные на месте');dosReact('jump')}).catch(()=>toast('Нет связи')):null,el=>window.Dos?Dos.mount(el,{epoch:epId(),mood:'happy'}):null);
  addEventListener('touchend',()=>FX.askOrient(),{once:true});
  setTimeout(epochIntroMaybe,300);
  S.backend=B;S.user=B.user;S.downloads=B.downloads;S.assets=B.assets;S.mcp=null;S.sample=null;
  const db=B.db;S.db=db;
  const sub=col=>db.collection(col).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});S[col]=o;S.ready[col]=true;render()});
  ['videos','clients','hooks','reviews','workouts','body','moods','notes','gtasks'].forEach(sub);
  let hasSettings=false;
  db.doc('settings/main').onSnapshot(s=>{hasSettings=s.exists;S.settings={...DEF,...(s.exists?s.data():{name:B.user.name||''})};S.ready.settings=true;render()});
  db.first.then(()=>{if(!hasSettings)put('settings','main',{...DEF,name:B.user.name||''})}).catch(()=>{if(!db.hasCache)toast('Нет связи с сервером. Покажу, когда появится интернет.')});
})();
})();
</script>
