<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B20F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Growth OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0;font:14px system-ui} img{max-width:100%} [hidden]{display:none!important}</style>
<style>
/* Layout: phone-first app. Brand-blue hero with halftone (from the Growth brandbook), white cards on a cool grey ground, glass tab bar with sliding indicator. Lime only for the one thing that matters most. */
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --surface-2:#F7F8FC; --fg:#0B0D17; --muted:#666C82; --line:#E3E5EE;
  --brand:#0B20F5; --brand-deep:#0716B8; --on-brand:#FFFFFF; --brand-soft:#E7EAFF; --lime:#E4FF3A; --on-lime:#0B0D17;
  --red:#E0243B; --red-soft:#FDE7EA; --amber:#B56A00; --amber-soft:#FFF0D6; --green:#0F8A4C; --green-soft:#DFF4E8;
  --glass:rgba(255,255,255,.78); --shadow:0 1px 2px rgba(11,13,23,.04),0 8px 24px -12px rgba(11,13,23,.12);
  --display:"Unbounded","Onest",system-ui,sans-serif; --font:"Onest",-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07080E; --surface:#12141F; --surface-2:#171A27; --fg:#EEF0F8; --muted:#8E93A8; --line:#232637;
  --brand:#3347FF; --brand-deep:#1A2BD6; --on-brand:#FFFFFF; --brand-soft:#191E4A; --lime:#E4FF3A; --on-lime:#0B0D17;
  --red:#FF5C6F; --red-soft:#3A1520; --amber:#F2A93B; --amber-soft:#33240D; --green:#3DD68C; --green-soft:#0E2C1D;
  --glass:rgba(18,20,31,.78); --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07080E; --surface:#12141F; --surface-2:#171A27; --fg:#EEF0F8; --muted:#8E93A8; --line:#232637;
  --brand:#3347FF; --brand-deep:#1A2BD6; --on-brand:#FFFFFF; --brand-soft:#191E4A; --lime:#E4FF3A; --on-lime:#0B0D17;
  --red:#FF5C6F; --red-soft:#3A1520; --amber:#F2A93B; --amber-soft:#33240D; --green:#3DD68C; --green-soft:#0E2C1D;
  --glass:rgba(18,20,31,.78); --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 132px}
.tnum{font-variant-numeric:tabular-nums}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);padding-block:12px 12px;display:flex;align-items:center;gap:12px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none}
.mark svg{width:21px;height:21px}
.hello{flex:1;min-width:0}
.hello b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.hello span{color:var(--muted);font-size:12.5px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:9px;background:var(--fg);transition:transform 320ms var(--ease-out)}
.seg[data-v="r"] .thumb{transform:translateX(100%)}
.seg button{position:relative;z-index:1;border:0;background:none;padding:7px 10px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;min-height:34px;transition:color 200ms ease}
.seg button[aria-pressed="true"]{color:var(--bg)}

/* entrance */
@keyframes rise{from{opacity:0;transform:translateY(10px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
.enter .it{animation:rise 460ms var(--ease-out) both;animation-delay:calc(min(var(--i,0),10) * 45ms)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;background:var(--brand);color:var(--on-brand);padding:18px 18px 16px;margin-top:4px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(rgba(255,255,255,.22) 1.1px,transparent 1.6px) 0 0/9px 9px;
  -webkit-mask:linear-gradient(115deg,transparent 35%,#000 100%);mask:linear-gradient(115deg,transparent 35%,#000 100%)}
.hero::after{content:"";position:absolute;z-index:-1;width:260px;height:260px;right:-90px;top:-120px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.22),transparent)}
.h-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.h-eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.h-big{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;letter-spacing:-.03em;margin:10px 0 4px}
.h-big small{font-family:var(--font);font-size:15px;font-weight:500;letter-spacing:0;opacity:.85;margin-left:6px}
.h-sub{font-size:13.5px;opacity:.85}
.ring{position:relative;width:72px;height:72px;flex:none}
.ring svg{width:72px;height:72px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .tr{stroke:rgba(255,255,255,.2)}
.ring .pg{stroke:var(--lime);stroke-dasharray:182.2;stroke-dashoffset:182.2;transition:stroke-dashoffset 1100ms var(--ease-out) 200ms}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:15px;font-weight:700}
.h-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.h-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;backdrop-filter:blur(4px)}
.h-chip.lime{background:var(--lime);color:var(--on-lime)}
.h-chip.lime b{font-family:var(--display);font-size:13px}

/* section heads */
.sec{display:flex;align-items:center;gap:8px;margin:26px 2px 10px}
.sec h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.sec .n{font-size:12px;font-weight:700;background:var(--line);color:var(--muted);border-radius:7px;padding:1px 7px;font-variant-numeric:tabular-nums}
.sec.hot h2{color:var(--red)} .sec.hot .n{background:var(--red-soft);color:var(--red)}
.sec .more{margin-left:auto;font-size:13px;color:var(--muted)}

/* lights scroller */
.lights{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px)) 6px;scrollbar-width:none}
.lights::-webkit-scrollbar{display:none}
.lc{scroll-snap-align:start;flex:0 0 72%;max-width:260px;background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;border:0;text-align:left;cursor:pointer;transition:transform 160ms var(--ease-out)}
.lc:active{transform:scale(.97)}
.lc-top{display:flex;align-items:center;gap:8px}
.lc-top b{flex:1;font-size:15px}
.lc p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4;min-height:35px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;transform-origin:left;transform:scaleX(0);transition:transform 900ms var(--ease-out) 250ms}
.lc small{font-size:12px;color:var(--muted)}

/* task list */
.list{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.trow{display:grid;grid-template-rows:1fr;transition:grid-template-rows 280ms var(--ease-io),opacity 220ms ease}
.trow>.clip{overflow:hidden;min-height:0;position:relative}
.trow+.trow .task{border-top:1px solid var(--line)}
.trow.collapse{grid-template-rows:0fr;opacity:0}
.swipe-bg{position:absolute;inset:0;background:var(--green);color:#fff;display:flex;align-items:center;padding-left:20px;font-weight:700;font-size:14px;gap:8px}
.task{position:relative;display:flex;gap:12px;align-items:flex-start;padding:13px 14px;background:var(--surface);cursor:pointer;touch-action:pan-y;user-select:none;transition:background 160ms ease}
.task.snap{transition:transform 320ms var(--ease-out),background 160ms ease}
@media (hover:hover) and (pointer:fine){.task:hover{background:var(--surface-2)}}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;margin-top:-1px;display:grid;place-items:center;padding:0;position:relative;transition:transform 160ms var(--ease-out),border-color 160ms ease,background 200ms ease}
.chk:active{transform:scale(.88)}
@media (hover:hover) and (pointer:fine){.chk:hover{border-color:var(--green)}}
.chk svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset 260ms var(--ease-out) 60ms}
.done .chk,.checking .chk{background:var(--green);border-color:var(--green)}
.done .chk svg,.checking .chk svg{stroke-dashoffset:0}
.checking .chk{animation:pop 380ms var(--ease-out)}
@keyframes pop{40%{transform:scale(1.18)}}
.t-title{font-weight:600;font-size:15px;line-height:1.35;transition:color 200ms ease}
.done .t-title,.checking .t-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.t-body{flex:1;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.cl{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.pill{font-size:11.5px;font-weight:600;border-radius:7px;padding:2px 7px;line-height:1.3}
.p-hot{background:var(--red-soft);color:var(--red)}
.p-client{background:var(--amber-soft);color:var(--amber)}
.p-blue{background:var(--brand-soft);color:var(--brand)}
.p-ex{box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.late{color:var(--red);font-weight:600}
.ava{width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;display:inline-grid;place-items:center;color:#fff;flex:none}
.empty{padding:22px 16px;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:10px}
.empty svg{width:20px;height:20px;stroke:var(--green);fill:none;stroke-width:2.2;flex:none}

/* timeline */
.tl{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:6px 14px}
.ev{display:grid;grid-template-columns:52px 14px 1fr;gap:0 10px;padding:10px 0}
.ev time{font-family:var(--display);font-size:13px;font-weight:500;padding-top:1px;font-variant-numeric:tabular-nums}
.ev time small{display:block;font-family:var(--font);font-size:11px;color:var(--muted);font-weight:500}
.rail{position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:-20px;width:2px;background:var(--line)}
.ev:last-child .rail::before{bottom:auto;height:14px}
.rail i{position:relative;width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--surface);border:3px solid var(--muted)}
.ev.shoot .rail i{border-color:var(--brand)}
.ev.big .rail i{border-color:var(--lime);background:var(--fg);box-shadow:0 0 0 4px color-mix(in srgb,var(--lime) 35%,transparent)}
.ev .addr{font-size:12.5px;color:var(--muted);margin-top:4px}
.route{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;font-weight:600;color:var(--brand);text-decoration:none;background:var(--brand-soft);border-radius:9px;padding:6px 10px;transition:transform 160ms var(--ease-out)}
.route:active{transform:scale(.97)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:2px max(16px,env(safe-area-inset-left,0px)) 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;font-weight:600;font-size:13.5px;padding:8px 14px;cursor:pointer;display:flex;gap:7px;align-items:center;min-height:38px;transition:background 200ms ease,color 200ms ease,transform 160ms var(--ease-out)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* calendar */
.strip{display:flex;gap:6px;overflow-x:auto;margin:12px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:4px max(16px,env(safe-area-inset-left,0px)) 6px;scroll-snap-type:x proximity;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{scroll-snap-align:start;flex:0 0 52px;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:8px 0 9px;text-align:center;cursor:pointer;min-height:72px;transition:background 220ms ease,color 220ms ease,transform 160ms var(--ease-out)}
.day:active{transform:scale(.95)}
.day small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;transition:color 220ms ease}
.day b{display:block;font-family:var(--display);font-size:18px;font-weight:500;margin-top:2px}
.day i{display:flex;justify-content:center;gap:3px;height:6px;margin-top:5px}
.day i span{width:5px;height:5px;border-radius:50%;background:var(--brand)}
.day.wk{opacity:.6}
.day[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.day[aria-pressed="true"] small{color:rgba(255,255,255,.75)}
.day[aria-pressed="true"] i span{background:var(--lime)}
.day.today:not([aria-pressed="true"]) b{color:var(--brand)}
.day.key:not([aria-pressed="true"]){box-shadow:inset 0 0 0 2px var(--lime),var(--shadow)}
.daytitle{font-family:var(--display);font-size:22px;font-weight:500;letter-spacing:-.02em;margin:22px 2px 2px}
.daytitle small{display:block;font-family:var(--font);font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0;margin-top:2px}

/* clients */
.clients{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.client{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.c-head{position:relative;padding:16px 16px 14px;display:flex;align-items:center;gap:12px}
.c-head::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,var(--cc) 0%,transparent 75%);opacity:.14}
.c-logo{position:relative;width:44px;height:44px;border-radius:13px;background:var(--cc);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;flex:none}
.c-head .nm{position:relative;flex:1;min-width:0}
.c-head .nm b{display:block;font-size:17px}
.c-head .nm span{font-size:13px;color:var(--muted)}
.sig{position:relative;font-size:12px;font-weight:700;border-radius:8px;padding:3px 9px;flex:none;display:inline-flex;align-items:center;gap:5px}
.sig::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-y{background:var(--amber-soft);color:var(--amber)} .s-g{background:var(--green-soft);color:var(--green)} .s-r{background:var(--red-soft);color:var(--red)} .s-n{background:var(--line);color:var(--muted)}
.c-body{padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.fact span{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.fact b{display:block;font-size:14px;margin-top:2px;font-weight:600}
.fact.wide{grid-column:1/-1}
.fact .todo{color:var(--amber)}
details.ask{background:var(--amber-soft);border-radius:12px;color:var(--amber)}
details.ask summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
details.ask summary::-webkit-details-marker{display:none}
details.ask summary svg{width:16px;height:16px;margin-left:auto;stroke:currentColor;fill:none;stroke-width:2.2;transition:transform 240ms var(--ease-out)}
details.ask[open] summary svg{transform:rotate(180deg)}
details.ask ul{margin:0;padding:0 12px 12px 30px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.team{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:center;
  padding:0 max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.tb{pointer-events:auto;position:relative;display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:440px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border-radius:22px;padding:6px;box-shadow:0 0 0 1px var(--line),0 12px 32px -12px rgba(0,0,0,.35)}
.tb .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:16px;background:var(--brand-soft);transform:translateX(calc(var(--ti,0) * 100%));transition:transform 380ms var(--ease-out)}
.tb button{position:relative;z-index:1;border:0;background:none;color:var(--muted);font-weight:600;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;cursor:pointer;min-height:50px;transition:color 220ms ease}
.tb button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform 200ms var(--ease-out)}
.tb button:active svg{transform:scale(.88)}
.tb button[aria-current="page"]{color:var(--brand)}
.fab{position:fixed;z-index:9;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(88px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--fg);color:var(--bg);cursor:pointer;display:grid;place-items:center;box-shadow:0 12px 28px -10px rgba(11,13,23,.55);transition:transform 160ms var(--ease-out)}
.fab:active{transform:scale(.93)}
.fab svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
@media (min-width:600px){.fab{right:calc(50% - 280px + 16px)}}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,5,12,0);transition:background 260ms ease}
.scrim.open{background:rgba(4,5,12,.5)}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:26px 26px 0 0;padding:8px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));
  transform:translateY(100%);transition:transform 240ms var(--ease-out);display:flex;flex-direction:column;gap:14px;max-height:88%;overflow:auto;touch-action:none}
.scrim.open .sheet{transform:translateY(0);transition:transform 460ms var(--ease-drawer)}
.sheet.dragging{transition:none!important}
.grab{align-self:center;width:40px;height:5px;border-radius:5px;background:var(--line);margin:2px 0 4px;flex:none}
.sheet h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.s-meta{display:flex;flex-wrap:wrap;gap:8px}
.s-meta .pill{font-size:12.5px;padding:4px 9px;border-radius:9px;display:inline-flex;gap:6px;align-items:center}
.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.statuses{position:relative;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface-2);border-radius:14px;padding:4px;gap:0}
.statuses .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/5);border-radius:10px;background:var(--surface);box-shadow:var(--shadow);transform:translateX(calc(var(--si,0) * 100%));transition:transform 320ms var(--ease-out)}
.statuses button{position:relative;z-index:1;border:0;background:none;padding:9px 2px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;line-height:1.2;min-height:44px;transition:color 200ms ease}

  });
  if(!any)h+=`<div class="list it" style="--i:${idx++};margin-top:14px">${EMPTY("Открытых задач нет")}</div>`;
  if(done.length){h+=`<button class="toggle" id="tgl">${showDone?"Скрыть":"Показать"} выполненные · ${done.length}</button>`;if(showDone)h+=list(sortT(done),me==="c","")}
  return h;
}
function vCal(){
  const d0=new Date(dt(TODAY));const w=(d0.getUTCDay()+6)%7;const start=add(TODAY,-w);
  const days=[...Array(14)].map((_,i)=>add(start,i));
  const miles=Object.entries(CLIENTS).flatMap(([k,c])=>c.miles.map(m=>({...m,c:k})));
  let h=`<div class="strip it" style="--i:${idx++}" id="strip">${days.map(d=>{const n=tasks.filter(t=>t.due===d&&!t.done).length;const key=miles.some(m=>m.d===d);
    return `<button class="day${d===TODAY?" today":""}${key?" key":""}${[0,6].includes(wd(d))?" wk":""}" data-day="${d}" aria-pressed="${d===selDay}"><small>${WD[wd(d)]}</small><b class="tnum">${dt(d).getUTCDate()}</b><i>${"<span></span>".repeat(Math.min(n,3))}</i></button>`}).join("")}</div>`;
  const dd=diff(TODAY,selDay);
  h+=`<div class="daytitle it" style="--i:${idx++}">${WDL[wd(selDay)][0].toUpperCase()+WDL[wd(selDay)].slice(1)}, ${fmt(selDay)}<small>${dd===0?"Сегодня":dd===1?"Завтра":dd>1?`Через ${dd} ${plural(dd,"день","дня","дней")}`:`${-dd} ${plural(dd,"день","дня","дней")} назад`}</small></div>`;
  const ms=miles.filter(m=>m.d===selDay);
  if(ms.length)h+=sec("Ключевое",ms.length)+`<div class="list it" style="--i:${idx++}">${ms.map(m=>`<div class="mile"><span class="dot" style="background:${CLIENTS[m.c].color}"></span><b>${esc(m.t)}</b><time>${CLIENTS[m.c].name}</time></div>`).join("")}</div>`;
  const ts=sortT(tasks.filter(t=>t.due===selDay));
  h+=sec("Сроки задач",ts.length,"","вся команда")+list(ts,true,"В этот день сроков нет");
  const up=miles.filter(m=>m.d>=TODAY).sort((a,b)=>a.d<b.d?-1:1);
  if(up.length)h+=sec("Ключевые даты",up.length)+`<div class="list it" style="--i:${idx++}">${up.map(m=>`<div class="mile"><span class="dot" style="background:${CLIENTS[m.c].color}"></span><b>${esc(m.t)}<span class="meta" style="display:flex">${CLIENTS[m.c].name}</span></b><time>${fmt(m.d)}</time></div>`).join("")}</div>`;
  return h;
}
function vClients(){
  return `<div class="clients">${Object.entries(CLIENTS).map(([k,c])=>{
    const all=tasks.filter(t=>t.src===k),o=all.filter(t=>!t.done),dn=all.length-o.length,p=all.length?dn/all.length:0,lt=o.filter(isLate).length;
    const body=all.length?`<div class="who-row">${["Асылбек","Расул",c.owner].map(n=>`<div class="fact"><span>${esc(n)}</span><b class="tnum">${o.filter(t=>t.who===n).length}</b></div>`).join("")}</div>
      <div><div class="bar"><i data-p="${p}" style="background:${c.color}"></i></div><div class="meta" style="margin-top:8px"><span class="tnum">${dn} из ${all.length} закрыто${lt?` · просрочено ${lt}`:""}${o.filter(t=>!t.who).length?` · без исполнителя ${o.filter(t=>!t.who).length}`:""}</span></div></div>
      <a class="openlink" href="${c.link}" target="_blank" rel="noopener">Открыть чеклист клиента →</a>`
      :`<div class="notyet"><b>Чеклист ещё не создан</b>Как только он появится, задачи Асылбека, Расула и ${esc(c.owner)} подтянутся сюда сами.</div>`;
    return `<article class="client it" style="--i:${idx++};--cc:${c.color}" id="c-${k}">
      <div class="c-head"><div class="c-logo">${c.mono}</div><div class="nm"><b>${c.name}</b><span>${c.niche}</span></div><span class="sig s-${all.length?"g":"n"}">${all.length?o.length+" откр.":"нет чеклиста"}</span></div>
      <div class="c-body"><div class="team">${ava("Асылбек")} маркетинг, съёмки · ${ava("Расул")} SMM, видео · ${ava(c.owner)} ${esc(c.owner)}</div>${body}</div></article>`}).join("")}</div>`;
}

/* ---------- render ---------- */
const view=document.getElementById("view");
function paintMeters(){requestAnimationFrame(()=>requestAnimationFrame(()=>{
  view.querySelectorAll(".pg").forEach(c=>c.style.strokeDashoffset=182.2*(1-(+c.dataset.p)));
  view.querySelectorAll(".bar i").forEach(b=>b.style.transform=`scaleX(${Math.max(+b.dataset.p,.02)})`)}))}
function render(anim=true){
  if(!loaded)return;idx=0;
  const y=window.scrollY;
  view.innerHTML={today:vToday,tasks:vTasks,cal:vCal,clients:vClients}[tab]();
  if(anim){view.classList.remove("enter");void view.offsetWidth;view.classList.add("enter")}
  else{view.classList.remove("enter");view.querySelectorAll(".pg,.bar i").forEach(el=>el.style.transition="none");window.scrollTo(0,y)}
  paintMeters();
  document.getElementById("hi").textContent=me==="c"?"Задачи клиентов":"Сәлем, "+meName();
  document.getElementById("sub").textContent=me==="c"?"Альбина · Арайлым · Нурболат":"Growth AG · "+(me==="a"?"маркетинг и съёмки":"SMM, съёмка, монтаж");
  const seg=document.getElementById("seg");seg.dataset.v=me;seg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.who===me));
  const tb=document.getElementById("tb");[...tb.querySelectorAll("button")].forEach((b,i)=>{if(b.dataset.tab===tab){b.setAttribute("aria-current","page");tb.style.setProperty("--ti",i)}else b.removeAttribute("aria-current")});
  if(tab==="cal"){const s=document.getElementById("strip"),a=s&&s.querySelector('[aria-pressed="true"]');if(a)s.scrollLeft=Math.max(0,a.offsetLeft-s.offsetLeft-60)}
  try{localStorage.setItem("growth-os-me",me)}catch(e){}
}

/* ---------- toast ---------- */
let toastEl,toastT;
function toast(msg,undo){
  if(toastEl)toastEl.remove();
  toastEl=document.createElement("div");toastEl.className="toast";toastEl.setAttribute("role","status");
  toastEl.innerHTML=`<span>${esc(msg)}</span>${undo?'<button type="button">Отменить</button>':""}`;
  document.body.appendChild(toastEl);const el=toastEl;
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("show")));
  if(undo)el.querySelector("button").onclick=()=>{undo();hide()};
  clearTimeout(toastT);toastT=setTimeout(hide,3600);
  function hide(){el.classList.remove("show");setTimeout(()=>el.remove(),260)}
}

/* ---------- complete ---------- */
const byKey=k=>tasks.find(t=>t.key===k);
function complete(k){
  const t=byKey(k);if(!t)return;
  if(t.done){t.done=false;render(false);saveDone(t,false);toast("Вернули в работу");return}
  busy=true;
  const rows=view.querySelectorAll(`[data-row="${CSS.escape(k)}"]`);
  rows.forEach(r=>r.querySelector(".task").classList.add("checking"));
  if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}
  setTimeout(()=>{rows.forEach(r=>r.classList.add("collapse"));
    setTimeout(async()=>{t.done=true;busy=false;render(false);
      toast("Готово: "+t.t,()=>{t.done=false;render(false);saveDone(t,false)});
      await saveDone(t,true);if(pending){pending=false;reload()}},290)},420);
}

/* swipe */
let drag=null;
view.addEventListener("pointerdown",e=>{const task=e.target.closest(".task");if(!task||e.target.closest(".chk")||e.button>0)return;
  drag={el:task,x:e.clientX,y:e.clientY,t:performance.now(),dx:0,on:false,k:task.dataset.open}});
view.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.on){if(Math.abs(dy)>10){drag=null;return}if(dx>8&&Math.abs(dx)>Math.abs(dy)){drag.on=true;drag.el.setPointerCapture(e.pointerId);drag.el.classList.remove("snap")}else return}
  let d=Math.max(0,dx);if(d>110)d=110+(d-110)*.35;drag.dx=dx;drag.el.style.transform=`translateX(${d}px)`});
view.addEventListener("pointerup",()=>{if(!drag)return;const d=drag;drag=null;
  if(!d.on){openTask(d.k);return}
  const v=d.dx/(performance.now()-d.t);d.el.classList.add("snap");d.el.style.transform="";
  if(d.dx>96||v>.6)complete(d.k)});
view.addEventListener("pointercancel",()=>{if(drag&&drag.on){drag.el.classList.add("snap");drag.el.style.transform=""}drag=null});

/* sheet */
function sheet(inner,onMount){
  const sc=document.createElement("div");sc.className="scrim";
  sc.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div>${inner}</div>`;
  document.body.appendChild(sc);const sh=sc.querySelector(".sheet");
  requestAnimationFrame(()=>requestAnimationFrame(()=>sc.classList.add("open")));
  const close=()=>{document.removeEventListener("keydown",k);sc.classList.remove("open");sh.style.transform="";setTimeout(()=>sc.remove(),260)};
  const k=e=>{if(e.key==="Escape")close()};document.addEventListener("keydown",k);
  sc.addEventListener("click",e=>{if(e.target===sc||e.target.closest("[data-close]"))close()});
  let g=null;
  sh.addEventListener("pointerdown",e=>{if(e.target.closest("button,a"))return;g={y:e.clientY,t:performance.now(),d:0};sh.setPointerCapture(e.pointerId);sh.classList.add("dragging")});
  sh.addEventListener("pointermove",e=>{if(!g)return;let d=e.clientY-g.y;d=d<0?d*.15:d;g.d=d;sh.style.transform=`translateY(${d}px)`});
  const up=()=>{if(!g)return;const v=g.d/(performance.now()-g.t);sh.classList.remove("dragging");if(g.d>110||v>.5)close();else sh.style.transform="";g=null};
  sh.addEventListener("pointerup",up);sh.addEventListener("pointercancel",up);
  onMount&&onMount(sh,close);
}
function openTask(k){
  const t=byKey(k);if(!t)return;const c=CLIENTS[t.src];
  sheet(`<h3>${esc(t.t)}</h3>
   <div class="s-meta"><span class="pill p-ex">${cl(t.src)}</span><span class="pill p-ex">${esc(t.group)}</span>${t.due?`<span class="pill ${isLate(t)?"p-hot":"p-ex"} tnum">${isLate(t)?"просрочено · ":""}${rel(t.due)}</span>`:""}<span class="pill p-ex">${ava(t.who)} ${esc(t.who||"не назначено")}</span>${t.crit?'<span class="pill p-hot">критично</span>':""}</div>
   ${t.n?`<p style="margin:0;color:var(--muted);font-size:14.5px">${esc(t.n)}</p>`:""}
   <a class="openlink" href="${c.link}" target="_blank" rel="noopener">Открыть в чеклисте ${esc(c.name)} →</a>
   <div class="row"><button class="btn ghost" data-close>Закрыть</button><button class="btn ${t.done?"ghost":"green"}" id="s-done" style="flex:1">${t.done?"Вернуть в работу":"Готово"}</button></div>`,
  (sh,close)=>{sh.querySelector("#s-done").onclick=()=>{close();setTimeout(()=>complete(t.key),180)}});
}

/* clicks */
document.addEventListener("click",e=>{
  const c=e.target.closest(".chk");if(c){e.stopPropagation();complete(c.dataset.k);return}
  const tb=e.target.closest(".tb button");if(tb){if(tab!==tb.dataset.tab){tab=tb.dataset.tab;render();window.scrollTo({top:0})}return}
  const w=e.target.closest("[data-who]");if(w){if(me!==w.dataset.who){me=w.dataset.who;render()}return}
  const ch=e.target.closest(".chip");if(ch){filter=ch.dataset.f;render(false);return}
  if(e.target.closest("#tgl")){showDone=!showDone;render(false);return}
  const dy=e.target.closest(".day");if(dy){selDay=dy.dataset.day;const sl=document.getElementById("strip").scrollLeft;render(false);document.getElementById("strip").scrollLeft=sl;return}
  const g=e.target.closest("[data-goto]");if(g){tab="clients";render();setTimeout(()=>{const el=document.getElementById("c-"+g.dataset.goto);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})},80);return}
});

try{const s=localStorage.getItem("growth-os-me");if(s&&(s==="a"||s==="r"||s==="c"))me=s}catch(e){}
document.getElementById("seg").dataset.v=me;
load();
})();
</script>
