<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15130D">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Смена">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<title>Смена AltynCup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: сверху тёмная «стойка» с кольцом прогресса и золотом, ниже светлый чек-лист; золото — у сделанного и главного, красный — только у просрочек */
:root{
  --paper:#F7F5EF; --surface:#FFFFFF; --seg:#EEEBE1; --line:#E6E1D2;
  --ink:#15130D; --ink-2:#5E5A4C; --ink-3:#8E8977;
  --night:#15130D; --night-2:#2A261C; --night-line:rgba(255,210,31,.24); --on-night:#F7F1DE; --on-night-2:#B8B098;
  --gold:#FFD21F; --gold-hi:#FFE98A; --gold-deep:#D9A100; --gold-soft:#FFF4CC; --gold-ink:#6B5300; --on-gold:#15130D;
  --gold-grad:linear-gradient(140deg,var(--gold-hi) 0%,var(--gold) 42%,var(--gold-deep) 100%);
  --glow:rgba(255,210,31,.22);
  --danger:#C1271C; --danger-soft:#FCEAE8; --on-danger:#FFFFFF;
  --ok:#1C7443; --ok-soft:#E4F2E9; --warn:#8F4E00; --warn-soft:#FFF0DC;
  --toast-act:#FFD21F; --scrim:rgba(14,13,10,.5);
  --shadow:0 1px 2px rgba(21,19,13,.06),0 12px 30px rgba(21,19,13,.10);
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E0D0A; --surface:#1A1812; --seg:#25221A; --line:#312D22;
  --ink:#F4EFDF; --ink-2:#ADA690; --ink-3:#7C7663;
  --night:#1F1C14; --night-2:#322D21; --night-line:rgba(255,210,31,.30);
  --gold-soft:#2C2510; --gold-ink:#FFD84A; --glow:rgba(255,210,31,.14);
  --danger:#FF6B5E; --danger-soft:#3A1715; --on-danger:#1B0806;
  --ok:#55C987; --ok-soft:#14291C; --warn:#F2A54A; --warn-soft:#33240F;
  --toast-act:#FFD21F; --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E0D0A; --surface:#1A1812; --seg:#25221A; --line:#312D22;
  --ink:#F4EFDF; --ink-2:#ADA690; --ink-3:#7C7663;
  --night:#1F1C14; --night-2:#322D21; --night-line:rgba(255,210,31,.30);
  --gold-soft:#2C2510; --gold-ink:#FFD84A; --glow:rgba(255,210,31,.14);
  --danger:#FF6B5E; --danger-soft:#3A1715; --on-danger:#1B0806;
  --ok:#55C987; --ok-soft:#14291C; --warn:#F2A54A; --warn-soft:#33240F;
  --toast-act:#FFD21F; --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.45);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
body.locked{overflow:hidden}
#app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(104px + env(safe-area-inset-bottom,0px))}
body.no-tabs #app{padding-bottom:calc(36px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:3px solid var(--gold-deep);outline-offset:2px;border-radius:12px}
h1,h2,h3{text-wrap:balance}
p{margin:0}
.muted{color:var(--ink-2)}
.hint{color:var(--ink-2);font-size:14px}
.err{color:var(--danger);font-size:14px;font-weight:600;min-height:1em}
.mt{margin-top:12px}
.goldtext{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* шапка */
.top{display:flex;align-items:center;gap:12px;padding-block:6px 2px}
.mark{width:34px;height:34px;flex:none;display:block}
.mark svg,.wm svg{width:100%;height:100%;display:block}
.top .tt{flex:1;min-width:0}
.top h1{font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:-.01em;margin:0;line-height:1.15}
.top .sub{color:var(--ink-2);font-size:14px;margin-top:2px}
.who{min-height:44px;padding:0 14px;border-radius:999px;background:var(--seg);font-weight:800;font-size:14px;display:inline-flex;align-items:center;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* тёмная стойка */
.hero{position:relative;overflow:hidden;isolation:isolate;background:var(--night);color:var(--on-night);border:1px solid var(--night-line);border-radius:26px;padding:16px;display:grid;gap:16px;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(85% 65% at 100% 0%,var(--glow),transparent 70%),radial-gradient(60% 50% at 0% 100%,rgba(255,210,31,.07),transparent 70%)}
.hero .wm,.award .wm{position:absolute;right:-30px;bottom:-40px;width:180px;height:180px;opacity:.07;z-index:-1;pointer-events:none}
.hero .top .sub{color:var(--on-night-2)}
.hero .who{background:transparent;border:1px solid var(--night-line);color:var(--gold)}
.dim{color:var(--on-night-2)}
.small{font-size:13px}
.hero .crew{font-size:15px}
.hero-acts{display:flex;gap:8px;flex-wrap:wrap}
.hero-acts .btn{flex:1 1 auto}
.hero-acts .btn.grow{flex:2 1 160px}

.stat{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.ring{position:relative;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:-.02em}
.ring.sm b{font-size:17px}
.stat-t{display:grid;gap:3px;min-width:0}
.s1{font-weight:800;font-size:17px;line-height:1.25}
.s2{font-size:13px;color:var(--on-night-2)}

.seg{display:flex;background:var(--seg);border-radius:14px;padding:3px;gap:3px;margin-top:14px}
.seg button{flex:1;min-height:44px;border-radius:11px;font-weight:800;font-size:15px;color:var(--ink-2);padding:0 8px;text-align:center;min-width:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.dark{background:var(--night-2);margin-top:0}
.seg.dark button{color:var(--on-night-2)}
.seg.dark button[aria-pressed="true"]{background:var(--gold-grad);color:var(--on-gold);box-shadow:0 4px 14px var(--glow)}
.seg.wrap{flex-wrap:wrap}
.seg.wrap button{flex:1 1 45%}

/* тревога и записка */
.alarm{margin-top:16px;background:var(--danger);color:var(--on-danger);border-radius:18px;padding:14px 16px;display:grid;gap:4px}
.alarm strong{font-size:16px;font-weight:800}
.alarm .al{font-size:14px;opacity:.95}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(193,39,28,.5)}50%{box-shadow:0 0 0 9px rgba(193,39,28,0)}}
.note{margin-top:16px;background:var(--gold-soft);border:1px solid var(--night-line);border-radius:18px;padding:14px 16px;display:grid;gap:4px}
.note-h{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink)}
.note p{white-space:pre-wrap;overflow-wrap:anywhere}

.prog{display:grid;gap:8px}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.big{font-family:var(--f-display);font-weight:600;font-size:28px;letter-spacing:-.02em;line-height:1}
.bar{height:8px;background:var(--seg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold-grad);border-radius:99px}

/* секции и задачи */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 8px;padding-inline:2px}
.sec-h h2{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);margin:0}
.sec-h .aside{font-size:13px;color:var(--ink-2);text-align:right;font-weight:700}
.list{background:var(--surface);border-radius:18px;border:1px solid var(--line);overflow:hidden}
.task{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;min-height:68px;border-top:1px solid var(--line);width:100%;text-align:left}
.task:first-child{border-top:0}
.task.act{cursor:pointer}
.task.act:active{background:var(--seg)}
.task.is-late{background:var(--danger-soft)}
.tick{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;color:var(--ink-2);flex:none}
.tick.cam{border-style:dashed;color:var(--ink)}
.tick.input{color:var(--ink)}
.tick .glyph{font-size:12px;font-weight:800}
.task.is-late .tick{border-color:var(--danger);color:var(--danger)}
.tick.done{background:var(--gold-grad);border:0;color:var(--on-gold);box-shadow:0 3px 10px var(--glow)}
.tick.busy{border-color:var(--gold)}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--seg);border-top-color:var(--gold-deep);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.thumb{width:44px;height:44px;border-radius:12px;overflow:hidden;background:var(--seg);display:block;flex:none;box-shadow:0 0 0 2px var(--gold)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.t-body{min-width:0;display:block}
.t-title{display:block;font-weight:700;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.task.is-done .t-title{color:var(--ink-2);font-weight:600}
.t-meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:13px;color:var(--ink-2);margin-top:3px;align-items:center}
.t-note{font-style:italic;overflow-wrap:anywhere}
.t-act{font-size:13px;font-weight:800;padding:7px 11px;border-radius:999px;background:var(--gold-soft);color:var(--gold-ink);white-space:nowrap;border:1px solid var(--night-line)}
.task.is-late .t-act{background:var(--danger);color:var(--on-danger);border-color:transparent}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--seg);color:var(--ink-2);line-height:1.6}
.chip.danger{background:var(--danger);color:var(--on-danger)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink)}
.empty{padding:22px 18px;text-align:center;color:var(--ink-2);font-size:15px}
.nextround{margin-top:8px;font-size:14px;color:var(--ink-2);padding-inline:2px}

details.more{margin-top:12px}
details.more summary{list-style:none;min-height:52px;display:flex;align-items:center;gap:8px;font-weight:800;cursor:pointer;padding:0 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
details.more[open] summary{margin-bottom:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg);margin-left:4px;margin-top:-4px}
details.more[open] summary::after{transform:rotate(-135deg);margin-top:4px}
details.more summary .count{margin-left:auto;font-size:13px;font-weight:800;min-width:26px;height:26px;border-radius:99px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold-ink);padding:0 7px}

/* кнопки */
.btn{min-height:50px;padding:0 18px;border-radius:14px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.gold{background:var(--gold-grad);color:var(--on-gold);box-shadow:0 6px 18px var(--glow)}
.btn.ghost{background:var(--seg);color:var(--ink)}
.btn.night-ghost{background:var(--night-2);color:var(--on-night);border:1px solid var(--night-line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%;display:flex}
.btn.sm{min-height:44px;font-size:14px;padding:0 14px;border-radius:12px}
.btn svg{flex:none}

/* награда */
.award{position:relative;overflow:hidden;isolation:isolate;margin-top:28px;width:100%;display:grid;gap:8px;background:var(--night);color:var(--on-night);border:1px solid var(--night-line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.award::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(80% 70% at 0% 100%,var(--glow),transparent 70%)}
.award-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--on-night-2)}
.prize{background:var(--gold-grad);color:var(--on-gold);padding:2px 10px;border-radius:999px;letter-spacing:.02em;text-transform:none;font-size:12px}
.award-b{display:grid;gap:2px}
.award-b .goldtext{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.15;letter-spacing:-.02em}
.award-s{font-size:15px;font-weight:700}
.award-me{font-size:14px;color:var(--on-night-2)}
.award-more{font-size:14px;font-weight:800;color:var(--gold);margin-top:2px}

/* таб-бар */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--night);border-top:1px solid var(--night-line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:20}
#tabs .in{display:flex;max-width:600px;margin:0 auto}
#tabs button{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:800;color:var(--on-night-2);position:relative;text-align:center}
#tabs .ti{display:grid;place-items:center;width:54px;height:30px;border-radius:999px}
#tabs button[aria-current="page"]{color:var(--gold)}
#tabs button[aria-current="page"] .ti{background:var(--gold-grad);color:var(--on-gold);box-shadow:0 4px 14px var(--glow)}
#tabs .dot{position:absolute;top:8px;left:calc(50% + 14px);min-width:18px;height:18px;border-radius:99px;background:var(--danger);color:var(--on-danger);font-size:11px;display:grid;place-items:center;padding:0 5px}

/* тост */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:70;width:min(568px,calc(100% - 32px));pointer-events:none}
body.no-tabs #toast{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.toast{pointer-events:auto;background:var(--night);color:var(--on-night);border:1px solid var(--night-line);border-radius:16px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;min-height:54px;box-shadow:var(--shadow)}
.toast .tx{flex:1;font-size:15px;font-weight:600;padding-block:8px}
.toast .act{color:var(--toast-act);font-weight:800;min-height:44px;padding:0 12px;border-radius:10px;flex:none}

/* шит */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:24px 24px 0 0;border-top:2px solid var(--gold);max-height:92%;overflow:auto;padding-top:8px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 10px}
.sheet-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.sheet-h h3{flex:1;font-family:var(--f-display);font-weight:600;font-size:19px;margin:6px 0 0;line-height:1.25;letter-spacing:-.01em}
.x{width:44px;height:44px;border-radius:50%;background:var(--seg);display:grid;place-items:center;flex:none}
.sheet-b{display:grid;gap:14px}
.kv{display:grid;gap:2px}
.kv span{font-size:13px;color:var(--ink-2)}
.kv b{font-size:16px}
.stock-row{display:grid;gap:6px}
.stock-name{font-weight:700}
.stock-row .seg{margin-top:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}
.photo-prev{width:100%;max-height:220px;object-fit:cover;border-radius:14px;display:block}

/* фото на весь экран */
.viewer{position:fixed;inset:0;background:#000;color:#fff;z-index:60;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer img{flex:1;min-height:0;width:100%;object-fit:contain}
.viewer .vbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.viewer .vcap{flex:1 1 180px;font-size:14px;min-width:0}
.viewer .vcap b{display:block;font-size:15px}
.viewer .vbtn{min-height:44px;padding:0 14px;border-radius:12px;background:#2A2A27;color:#fff;font-weight:800}
.viewer .vbtn.gold{background:linear-gradient(140deg,#FFE98A,#FFD21F 42%,#D9A100);color:#15130D}

/* мониторинг */
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:16px}
.pcard{position:relative;overflow:hidden;isolation:isolate;background:var(--night);color:var(--on-night);border:1px solid var(--night-line);border-radius:22px;padding:16px;display:grid;gap:12px;width:100%;box-shadow:var(--shadow)}
.pcard::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(90% 70% at 100% 0%,var(--glow),transparent 70%)}
.pc-name{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:-.01em}
.pc-crew{font-size:14px;color:var(--on-night-2)}
.pcard .chip:not(.danger):not(.ok){background:var(--night-2);color:var(--on-night-2)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .pt{font-weight:700;overflow-wrap:anywhere}
.prow .pm{font-size:13px;color:var(--ink-2);margin-top:2px}
.prow .pr{display:flex;gap:8px;align-items:center}
.feed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.feed button{aspect-ratio:1;max-width:100%;border-radius:14px;overflow:hidden;position:relative;background:var(--seg)}
.feed img{width:100%;height:100%;object-fit:cover;display:block}
.feed .ft{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav b{font-family:var(--f-display);font-weight:600;font-size:18px}
.iconbtn{width:44px;height:44px;border-radius:12px;background:var(--seg);display:grid;place-items:center;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.cal .dow{font-size:11px;color:var(--ink-2);text-align:center;font-weight:800;padding-block:4px}
.cal button{min-height:52px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center}
.cal .n{font-weight:800;font-size:13px}

    }else if(t.due){

function hoursOf(cfg,p,date){const off=isOffDay(cfg,date);return{open:(off&&p.wopen)||p.open,close:(off&&p.wclose)||p.close,off};}
function pointTimes(pid,date){const p=S.cfg.points.find(x=>x.id===pid)||S.cfg.points[0];const hr=hoursOf(S.cfg,p,date);const base=parseYmd(date).getTime();let o=toMin(hr.open),c=toMin(hr.close);if(c<=o)c+=1440;return{open:base+o*6e4,close:base+c*6e4,off:hr.off};}
function classify(pid,date,plan,marks,now){
  const t=pointTimes(pid,date);
  const phase=now<t.open?'open':now<t.close-90*6e4?'during':'close';
  const r={phase,overdue:[],current:[],later:[],done:[],next:null};
  for(const it of plan){
    const m=marks[it.k];
    if(!m&&!it.opt&&now>it.dl){r.overdue.push(it);continue;}
    const active=it.blk==='during'?(now>=it.start&&now<it.dl):it.blk===phase;
    if(active){r.current.push(it);continue;}
    if(m){r.done.push(it);continue;}
    if(it.blk==='during'){if(it.start>now&&!it.spot&&(!r.next||it.start<r.next))r.next=it.start;continue;}
    r.later.push(it);

  return{req:req.length,done,late,pct:req.length?Math.round(done/req.length*100):0};
}
function dueScore(plan,marks,now){
  const req=plan.filter(i=>!i.opt);const due=req.filter(i=>i.dl<=now||marks[i.k]);let done=0;for(const i of due)if(marks[i.k])done++;

function monthStats(docs){
  const by={};const get=b=>by[b]||(by[b]={b,xp:0,shifts:0,onTime:0,late:0,seq:[],hours:0});
  const reqIn=!!S.cfg?.requireCheckin;
  for(const d of docs){
    const plan=d.plan||[],marks=d.marks||{};const sc=dayScore(plan,marks);const crew=d.crew||{};
    const okIn=b=>!reqIn||!!(crew[b]&&crew[b].in);
    for(const [b,c] of Object.entries(crew))if(c&&c.in&&c.out)get(b).hours+=(c.out.at-c.in.at)/36e5;
    const clean=sc.req>0&&sc.done===sc.req&&sc.late===0;
    const people=new Set(Object.keys(crew).filter(okIn));
    for(const it of plan){const m=marks[it.k];if(!m||!m.b||!okIn(m.b))continue;people.add(m.b);const r=get(m.b);if(m.late){r.xp+=5;r.late++;}else{r.xp+=10;r.onTime++;}}
    for(const b of people){const r=get(b);r.shifts++;if(!(d.date===S.today&&!clean))r.seq.push({date:d.date,clean});}
  }
  const min=Number(S.cfg?.award?.minShifts)||0;
  const rows=Object.values(by).map(r=>{r.seq.sort((a,b)=>a.date<b.date?-1:1);let st=0;for(let i=r.seq.length-1;i>=0;i--){if(r.seq[i].clean)st++;else break;}

function staffSheet(b,docs,key){

function buyList(){
  const out=[];
  for(const p of S.cfg.points){
    const docs=S.cur.docs.filter(d=>d.point===p.id&&d.date!==S.today);if(S.days[p.id])docs.push(S.days[p.id]);
    docs.sort((a,b)=>a.date<b.date?1:-1);let found=null;
    for(const d of docs){const sk=(d.plan||[]).find(i=>i.kind==='stock');const m=sk&&d.marks&&d.marks[sk.k];if(m&&m.stock){found=m;break;}}
    if(!found)continue;
    for(const [name,v] of Object.entries(found.stock)){if(v!=='low')continue;const key=p.id+':'+name;if((S.buy[key]||0)>=found.at)continue;out.push({p,name,key,at:found.at,b:found.b});}
  }
  return out;
}

const live={},chans={},bumpT={};

async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args);if(error)throw dbErr(error);

const mkSnap=row=>({id:row?row.id:null,exists:!!row,data:()=>row?row.data:undefined,metadata:{}});
const DB={
  doc(path){const [t,id]=path.split('/');const ref={id,path,
    async get(){const {data,error}=await sb.from(t).select('id,data').eq('id',id).maybeSingle();if(error)throw dbErr(error);return mkSnap(data);},
    set:data=>rpc('doc_set',{tbl:t,p_id:id,p_data:data}),
    update:patch=>rpc('doc_merge',{tbl:t,p_id:id,p_patch:patch}),
    onSnapshot(next,err){let alive=true;const run=()=>ref.get().then(s=>{if(alive)next(s);}).catch(e=>{if(alive&&err)err(e);});const off=onTable(t,run);run();return()=>{alive=false;off();};}};
    return ref;},
  collection(path){const mk=f=>{const q={
    where:(fld,op,v)=>mk([...f,[fld,op,v]]),
    async get(){let qq=sb.from(path).select('id,data');for(const [fld,op,v] of f)qq=op==='<'?qq.lt(fld,v):qq.eq(fld,v);
      const {data,error}=await qq.limit(3000);if(error)throw dbErr(error);const docs=(data||[]).map(mkSnap);return{docs,size:docs.length,empty:!docs.length};},
    onSnapshot(next,err){let alive=true;const run=()=>q.get().then(s=>{if(alive)next(s);}).catch(e=>{if(alive&&err)err(e);});const off=onTable(path,run);run();return()=>{alive=false;off();};}};return q;};
    return mk([]);}
};
const GIF='data:image/gif;base64,R0lGODlhAQABAAAAACw=';
const URLS={},PEND=new Set();let urlT=null;
function blobUrl(id){if(!id)return GIF;const c=URLS[id];if(c&&c.exp>Date.now())return c.url||GIF;
  PEND.add(id);clearTimeout(urlT);urlT=setTimeout(loadUrls,30);return GIF;}
async function loadUrls(){const ids=[...PEND];PEND.clear();if(!ids.length||!sb)return;
  try{const {data}=await sb.storage.from('media').createSignedUrls(ids,6*3600);const ok=new Set();
    for(const r of data||[])if(r.signedUrl&&r.path){URLS[r.path]={url:r.signedUrl,exp:Date.now()+5*3600e3};ok.add(r.path);}
    for(const id of ids)if(!ok.has(id))URLS[id]={url:'',exp:Date.now()+60e3};}
  catch(e){for(const id of ids)URLS[id]={url:'',exp:Date.now()+30e3};}
  schedule();}
async function urlOf(id){const c=URLS[id];if(c&&c.url&&c.exp>Date.now())return c.url;
  const {data}=await sb.storage.from('media').createSignedUrl(id,6*3600);URLS[id]={url:data?.signedUrl||'',exp:Date.now()+5*3600e3};return URLS[id].url;}

  const fk=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fk:null;
  app.replaceChildren(buildView());renderTabs();
  if(fk){const el=app.querySelector(`[data-fk="${CSS.escape(fk)}"]`);if(el)el.focus({preventScroll:true});}
}
function schedule(){if(S.renderQ)return;S.renderQ=true;requestAnimationFrame(render);}

/* ---------- подписки ---------- */
function subDays(){
  const sig=S.cfg.points.map(p=>p.id).join(',')+'|'+S.today;if(S.daysSig===sig)return;S.daysSig=sig;
  (S.daysUnsub||[]).forEach(u=>u());S.days={};
  if(S.reqUnsub)S.reqUnsub();
  S.reqUnsub=S.db.collection('requests').where('date','==',S.today).onSnapshot(q=>{S.reqs=q.docs.map(d=>({id:d.id,...d.data()}));schedule();},()=>{});
  S.daysUnsub=S.cfg.points.map(p=>S.db.doc(docPath(p.id,S.today)).onSnapshot(s=>{S.days[p.id]=s.exists?s.data():null;schedule();},()=>{}));
}
function subCur(){
  const key=S.today.slice(0,7);if(S.cur.key===key)return;if(S.cur.unsub)S.cur.unsub();
  if(!S.monKey||S.monKey===S.cur.key)S.monKey=key;
  S.cur={key,docs:[]};S.cur.unsub=S.db.collection('days').where('month','==',key).onSnapshot(q=>{S.cur.docs=q.docs.map(d=>d.data());schedule();},()=>{});
}
function onCfg(){
  if(!S.cfg)return;const pts=S.cfg.points.map(p=>p.id);
  if(!S.point||!pts.includes(S.point)){const saved=LS.get('point');S.point=pts.includes(saved)?saved:pts[0];}
  subDays();subCur();
}
function tick(){S.now=nowMs();const d=businessDate(S.now);if(d!==S.today){S.today=d;if(S.cfg){subDays();subCur();}}if(S.tab!=='set')schedule();}
async function boot(){
  schedule();
  if(!window.supabase){S.fatal='Не удалось загрузить приложение. Проверьте интернет и обновите страницу.';S.ready=true;return schedule();}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  S.db=DB;S.assets=ASSETS;S.dl=DL;S.sample=null;
  const {data:{session}}=await sb.auth.getSession();
  if(!session){await loadLoginList();const last=LS.get('last');if(last&&S.loginList)S.loginSel=S.loginList.find(x=>x.login===last)||null;S.needLogin=true;S.ready=true;return schedule();}
  const {data:row}=await sb.from('staff').select('login,name,role,active').eq('uid',session.user.id).maybeSingle();
  if(!row||!row.active){await sb.auth.signOut();await loadLoginList();S.loginErr='Аккаунт отключён. Обратитесь к владельцу.';S.needLogin=true;S.ready=true;return schedule();}
  S.me=row;S.isOwner=row.role==='owner';S.uid=row.login;
  try{const t=await rpc('now_ms',{});S.skew=Number(t)-Date.now();}catch(e){S.skew=0;}
  S.today=businessDate(nowMs());S.now=nowMs();S.ready=true;
  if(isMgr())S.tab='mon';
  await loadStaff();onTable('staff',()=>{loadStaff();loadPw();});loadPw();
  DB.doc('cfg/main').onSnapshot(s=>{S.cfg=s.exists?s.data():null;S.cfgLoaded=true;onCfg();schedule();},()=>{S.fatal='Нет доступа к данным. Выйдите и войдите заново.';schedule();});
  DB.collection('problems').where('status','==','open').onSnapshot(q=>{S.problems=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);schedule();},()=>{});
  DB.doc('state/buy').onSnapshot(s=>{S.buy=s.exists?s.data():{};schedule();},()=>{});
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.reload();});
  syncPush();if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='refresh')refreshAll();});
  setInterval(tick,30000);setInterval(refreshAll,60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();refreshAll();}});
}
boot();
</script>
